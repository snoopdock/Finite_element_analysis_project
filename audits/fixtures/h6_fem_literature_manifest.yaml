trial_requirements:
  preserve_pdf_free_repository: true
  require_multiple_source_types: true
  require_distinct_scientific_roles: true
  do_not_store_pdf_bytes: true
  do_not_infer_claims_from_metadata: true
  expected_checks:
    - source identity survives ingestion
    - source characterization remains distinct from retrieval provenance
    - propositions can cite multiple independent sources
    - evidence relations require actual passage evidence
    - book/report metadata alone does not become proposition support
    - differing source roles remain distinguishable
