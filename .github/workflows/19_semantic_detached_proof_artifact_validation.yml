name: G3.4.5 Detached and Streaming Proof Artifact Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: G3.0-G3.3.2 regression suites
        run: >-
          pytest
          tests/semantic_graph
          tests/semantic_verification
          tests/semantic_domain_verification
          tests/semantic_graph_evolution
          tests/semantic_reverification_execution
          tests/semantic_audit_orchestration
          tests/semantic_orchestration_integration
          -v

      - name: G3.4 high-assurance verification suite
        run: pytest tests/semantic_high_assurance -v

      - name: Full repository regression
        run: pytest -q

      - name: Validate detached and streaming proof architecture
        run: python tools/validate_semantic_detached_proof_artifacts.py

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-detached-proof-artifact-validation
          path: artifacts/semantic_detached_proof_artifact_validation.json
          if-no-files-found: error
