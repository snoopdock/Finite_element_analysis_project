name: LaTeX Audit

on:
  push:
    branches:
      - stage1/section-uuids
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run LaTeX contract tests
        run: >-
          python -m pytest -q
          tests/test_latex_ir.py
          tests/test_latex_builder.py
          tests/test_latex_references.py
          tests/test_latex_ir_metadata_validation.py

      - name: Run LaTeX escaping diagnostic
        run: python scripts/latex_escape_audit.py
