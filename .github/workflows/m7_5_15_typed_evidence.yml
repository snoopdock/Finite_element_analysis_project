name: AE-32C M7.5.15 Typed Evidence Observation and Binding

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_15_typed_evidence.yml"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m7515_*.py"
      - "docs/audit-engine/AE-32C-M7.5.15-*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ae32c-m7515-stage1
  cancel-in-progress: false
jobs:
  typed-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile epistemic implementation
        run: python -m compileall -q audit_engine/semantic_audit/epistemic
      - name: Dedicated M7.5.15 tests
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7515_*.py' -v
      - name: Complete M7.5 regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m75*.py' -v
      - name: Assurance boundary
        if: always()
        run: |
          {
            echo "## M7.5.15 typed evidence observations"
            echo "- Structural observations are not semantic acceptance"
            echo "- Unsupported evidence kinds remain unresolved"
            echo "- No epistemic assertions or dossier upgrades"
            echo "- No proposition truth, audit decision, authorization, or production approval"
          } >> "$GITHUB_STEP_SUMMARY"
