name: AE-32C M7.5.10 Durable Coverage Dossier Validation

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_10_coverage_dossier.yml"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m75*.py"
      - "docs/audit-engine/AE-32C-M7.5.10-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32c-m7510-stage1
  cancel-in-progress: false

jobs:
  coverage-dossier-validation:
    name: M7.5.10 durable dossier and M7.5 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile epistemic package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m compileall -q audit_engine/semantic_audit/epistemic 2>&1 | tee reports/m7510-compile.log

      - name: Run complete M7.5 regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75*.py' \
            -v 2>&1 | tee reports/m7510-regression.log

      - name: Upload exact-source validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-5-10-coverage-dossier-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/m7510-compile.log
            reports/m7510-regression.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize validation boundary
        if: always()
        run: |
          {
            echo "## M7.5.10 coverage dossier validation"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Scope: durable append-only dossier persistence, restart recovery, all-gap reconciliation, source-ledger drift detection, and tamper detection"
            echo "- Cross-ledger capture is optimistic, not atomic"
            echo "- No audit decision, authorization, proposition-truth inference, or universal completeness promotion"
          } >> "$GITHUB_STEP_SUMMARY"
