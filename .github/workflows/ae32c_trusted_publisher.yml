name: AE-32C Trusted Publisher

on:
  workflow_run:
    workflows:
      - AE-32C GitHub Source and Graph Snapshot
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ae32c-trusted-publisher-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  trusted-publisher:
    # Deliberately inert until repository controls and credentials are configured
    # and an administrator explicitly sets this repository variable to "true".
    if: ${{ vars.AE32C_TRUSTED_PUBLISHER_ENABLED == 'true' }}
    name: Validate upstream artifact and publish guarded state
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ae32c-publication
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted default-branch workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Establish Python runtime
        run: python --version

      - name: Install trusted schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Validate exact upstream run and artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/ae32c_trusted_publisher.py prepare

      # This step is intentionally after full metadata, artifact, schema, digest,
      # and source/graph validation. The token is scoped to this repository.
      - name: Mint repository-scoped publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AE32C_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.AE32C_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Finite_element_analysis_project
          permission-contents: write

      - name: Publish through durable ref compare-and-swap
        env:
          AE32C_PUBLICATION_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          python tools/ae32c_trusted_publisher.py publish
