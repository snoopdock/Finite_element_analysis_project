name: AE-32C M7.5.23 Cross-Layer Obligation Composition

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_23_obligation_composition.yml"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m7523_*.py"
      - "tests/semantic_graph/test_m7514_*.py"
      - "tests/semantic_graph/test_m7517_*.py"
      - "tests/semantic_graph/test_m7521_*.py"
      - "tests/semantic_graph/test_m7522_*.py"
      - "docs/audit-engine/AE-32C-M7.5.23-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32c-m7523-stage1
  cancel-in-progress: false

jobs:
  obligation-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile epistemic implementation
        run: python -m compileall -q audit_engine/semantic_audit/epistemic
      - name: Dedicated M7.5.23 composition tests
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7523_*.py' -v
      - name: M7.5.14 execution-obligation regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7514_*.py' -v
      - name: M7.5.17 semantic qualification regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7517_*.py' -v
      - name: M7.5.21 currentness-gated consumer regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7521_*.py' -v
      - name: M7.5.22 dependency-boundary regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7522_*.py' -v
      - name: Complete M7.5 regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m75*.py' -v
      - name: Composition authority-boundary summary
        if: always()
        run: |
          {
            echo "## M7.5.23 cross-layer obligation composition"
            echo "- Execution and semantic qualification remain separate assessment axes"
            echo "- Qualification dispositions are current only after M7.5.21 currentness and replay"
            echo "- Blocked qualification dispositions are retained as historical context only"
            echo "- No evidence acceptance, proposition truth, assurance success, ALLOW/DENY, release, or production authority is created"
          } >> "$GITHUB_STEP_SUMMARY"
