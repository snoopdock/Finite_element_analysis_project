name: FEA Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Cache Raw Text (Zero Bloat)
        uses: actions/cache@v4
        with:
          path: output/raw_text
          key: raw-text-cache-${{ github.run_id }}
          restore-keys: |
            raw-text-cache-

      - name: Run Tests
        run: |
          pytest tests/ -v || true

      - name: Run FEA Pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python main.py --config config.yaml

      - name: Commit current state (Zero History)
        run: |
          git config user.name "guideline-bot"
          git config user.email "guideline-bot@users.noreply.github.com"
          git checkout --orphan temp-squash-branch
          git add -A
          git commit -m "Current State: $(date -u +%Y-%m-%d_%H:%M)"
          git branch -D main
          git branch -m main
          git push -f origin main

      - name: Upload Error Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-error-logs
          path: |
            output/error.txt
            output/validation_report.md
          if-no-files-found: warn
