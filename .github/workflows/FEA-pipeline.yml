name: FEA Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Raw Text
        uses: actions/cache@v4
        with:
          path: output/raw_text
          key: raw-text-cache-${{ runner.os }}-${{ hashFiles('config.yaml', 'requirements.txt') }}
          restore-keys: |
            raw-text-cache-${{ runner.os }}-
            raw-text-cache-

      - name: Run FEA Pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEA_MAX_LLM_CALLS: 20
          FEA_CACHE_MAX_SIZE_MB: 500
        run: |
          python main.py --config config.yaml

      - name: Enforce raw-text cache limit
        if: always()
        env:
          FEA_CACHE_MAX_SIZE_MB: 500
        run: |
          python - <<'PY'
          from research.content_cache import cleanup_cache, get_cache_stats

          stats = cleanup_cache()
          print(
              "Cache: "
              f"{stats['total_size_mb']:.2f} MB / "
              f"{stats['max_size_mb']:.2f} MB "
              f"({stats['total_files']} files)"
          )
          if stats["total_size_mb"] > stats["max_size_mb"] + 1e-6:
              raise SystemExit("Raw-text cache remains above configured limit")
          PY

      - name: Report raw-text cache usage
        if: always()
        run: |
          if [ -d output/raw_text ]; then
            echo "Raw-text cache size:"
            du -sh output/raw_text || true
            echo "Largest cache files:"
            find output/raw_text -maxdepth 1 -type f -printf '%s %p\n' 2>/dev/null \
              | sort -nr \
              | head -10 \
              | awk '{printf "%.1f MB %s\n", $1/1024/1024, $2}'
          else
            echo "Raw-text cache directory does not exist."
          fi

      - name: Commit generated state and outputs
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "guideline-bot"
          git config user.email "guideline-bot@users.noreply.github.com"
          git add -A
          git commit -m "Current State: $(date -u +%Y-%m-%d_%H:%M)"
          git push origin HEAD:main

      - name: Upload Error Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-error-logs
          path: |
            output/error.txt
            output/validation_report.md
          if-no-files-found: warn
