name: FEA Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Reset persisted runtime state/output/cache before running"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.ref }}

      - name: Debug branch information
        run: |
          echo "Workflow ref:"
          echo "${{ github.ref }}"

          echo "Workflow ref name:"
          echo "${{ github.ref_name }}"

          echo "Checked out branch:"
          git branch --show-current

          echo "Commit:"
          git log -1 --oneline

      - name: Install system publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            lmodern
          tesseract --version
          pdflatex --version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing!"
            exit 1
          fi

          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Cache Raw Text
        uses: actions/cache@v4
        with:
          path: output/raw_text
          key: raw-text-cache-${{ runner.os }}-${{ hashFiles('config.yaml', 'requirements.txt') }}
          restore-keys: |
            raw-text-cache-${{ runner.os }}-
            raw-text-cache-

      - name: Reset runtime state for fresh start
        if: github.event_name == 'workflow_dispatch' && inputs.fresh_start
        run: |
          echo "Fresh start requested: removing generated runtime state and outputs."

          rm -f \
            state/current_state.json \
            state/reading_state.json \
            output/evidence.json \
            output/research.json \
            output/sections.json \
            output/guideline.tex \
            output/validation_report.md \
            output/document.semantic-candidate.json \
            output/guideline.pdf \
            output/guideline.log \
            output/publication_manifest.json \
            output/error.txt

          rm -rf output/raw_text

          mkdir -p state output output/raw_text
          touch state/.gitkeep output/.gitkeep

          echo "Runtime reset complete."
          git status --short

      - name: Clear current-run publication artifacts
        run: |
          # These files are validation outputs of the *current* run. Removing
          # prior copies prevents a failed run from uploading stale success
          # manifests/logs or leaving an old TeX artifact in the workspace.
          rm -f \
            output/guideline.tex \
            output/guideline.pdf \
            output/guideline.log \
            output/publication_manifest.json \
            output/error.txt

      - name: Run FEA Pipeline
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEA_MAX_LLM_CALLS: 50
          FEA_CACHE_MAX_SIZE_MB: 500
        run: |
          python main.py --config config.yaml

      - name: Validate and compile publication artifact
        run: |
          python -m processing.publication_integrity_cli \
            --tex output/guideline.tex \
            --pdf output/guideline.pdf \
            --manifest output/publication_manifest.json \
            --semantic-document output/document.semantic-candidate.json \
            --state state/current_state.json \
            --ir-contract specs/contracts/document_latex_ir_projection_contract.yaml \
            --passes 2

      - name: Upload validated publication artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: validated-publication
          path: |
            output/guideline.pdf
            output/guideline.tex
            output/guideline.log
            output/publication_manifest.json
          if-no-files-found: error

      - name: Generate Quality Report Artifact
        if: always()
        run: |
          python -m processing.quality_report_cli \
            --output artifacts/quality_report.json

      - name: Upload Quality Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: artifacts/quality_report.json
          if-no-files-found: warn

      - name: Enforce raw-text cache limit
        if: always()
        env:
          FEA_CACHE_MAX_SIZE_MB: 500
        run: |
          python - <<'PY'
          from research.content_cache import cleanup_cache, get_cache_stats

          stats = cleanup_cache()

          print(
              "Cache: "
              f"{stats['total_size_mb']:.2f} MB / "
              f"{stats['max_size_mb']:.2f} MB "
              f"({stats['total_files']} files)"
          )

          if stats["total_size_mb"] > stats["max_size_mb"] + 1e-6:
              raise SystemExit(
                  "Raw-text cache remains above configured limit"
              )
          PY

      - name: Report raw-text cache usage
        if: always()
        run: |
          if [ -d output/raw_text ]; then
            echo "Raw-text cache size:"
            du -sh output/raw_text || true
          else
            echo "Raw-text cache directory does not exist."
          fi

      - name: Commit generated state and outputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "guideline-bot"
          git config user.email "guideline-bot@users.noreply.github.com"

          git add -A

          git commit \
            -m "Current State: $(date -u +%Y-%m-%d_%H:%M)"

          git push origin HEAD:${{ github.ref_name }}

      - name: Upload Error Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-error-logs
          path: |
            output/error.txt
            output/validation_report.md
            output/sections.json
            output/document.semantic-candidate.json
            output/publication_manifest.json
            output/guideline.log
          if-no-files-found: warn
