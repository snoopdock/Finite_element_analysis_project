name: GB-01 Manual Optional Native Graph Backend Smoke

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Development branch to validate
        required: true
        type: string
        default: stage1/section-uuids
      backend:
        description: Native library to install and verify on this runner
        type: choice
        required: true
        default: igraph
        options:
          - igraph
          - graph-tool
          - snap

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: source
          persist-credentials: false

      - name: Configure normal Python
        if: inputs.backend != 'graph-tool'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.backend == 'snap' && '3.9' || '3.11' }}

      - name: Install igraph binary package
        if: inputs.backend == 'igraph'
        run: |
          set -euo pipefail
          python -m pip install 'igraph>=0.11,<2'

      - name: Install Stanford Snap.py using CPython 3.9 compatible binary wheel
        if: inputs.backend == 'snap'
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: snap-stanford==6.0.0

      - name: Install graph-tool with Ubuntu system Python 3.12
        if: inputs.backend == 'graph-tool'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-graph-tool

      - name: Check SNAP Python 3.9 import contract before native execution
        if: inputs.backend == 'snap'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=source python - <<'PY39'
          import sys
          from typing import Optional, get_type_hints
          assert sys.version_info[:2] == (3, 9), sys.version
          from audit_engine.semantic_audit.core.semantic_graph import SemanticGraph, SemanticNode, SemanticEdge
          from audit_engine.semantic_audit.graph.backend.backend_factory import BackendFactory
          from audit_engine.semantic_audit.graph.backend.execution_context import BackendExecutionContext
          from audit_engine.semantic_audit.graph.backend.snap_adapter import SNAPAdapter
          import snap
          assert hasattr(snap, "TNEANet"), "Wrong SNAP module imported"
          assert get_type_hints(SemanticGraph.get_node)["return"] == Optional[SemanticNode]
          assert BackendFactory._ADAPTERS["snap"][1] == "SNAPAdapter"
          print("SNAP CPython 3.9 preflight: PASS; native module:", snap.__file__)
          PY39

      - name: Run actual native adapter smoke test
        shell: bash
        env:
          NATIVE_BACKEND: ${{ inputs.backend }}
        run: |
          set -euo pipefail
          mkdir -p native-smoke-artifacts
          if [ "$NATIVE_BACKEND" = graph-tool ]; then
            PY=/usr/bin/python3
          else
            PY=python
          fi
          "$PY" -c 'import sys; print("Python:", sys.executable, sys.version)'
          PYTHONPATH=source "$PY" source/tools/gb01_native_smoke.py \
            --backend "$NATIVE_BACKEND" \
            --output native-smoke-artifacts/native_report.json \
            2>&1 | tee native-smoke-artifacts/native-test.log

      - name: Upload native verification artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gb01-native-${{ inputs.backend }}-${{ github.run_id }}
          path: native-smoke-artifacts/
          if-no-files-found: warn
          retention-days: 30
