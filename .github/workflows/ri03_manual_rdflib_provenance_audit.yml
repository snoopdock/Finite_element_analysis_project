name: RI-03 Manual RDFLib Provenance, Consistency and Performance Review

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Development branch with accepted RI-01 / RI-02 and G4
        required: true
        default: stage1/section-uuids
        type: string
      source_mode:
        description: GE-02 persisted state or a repository candidate graph
        required: true
        default: persisted
        type: choice
        options: [persisted, candidate]
      knowledge_graph_path:
        description: Repository-relative candidate JSON; ignored in persisted mode
        required: true
        default: examples/graph_engine/ge02_demo_graph.json
        type: string
      query:
        description: Fixed SPARQL query from the RI-03 catalog
        required: true
        default: relations_with_unverified_support
        type: choice
        options:
          - relations_with_unverified_support
          - sources_for_proposition
          - propositions_citing_source
          - concept_evidence_paths
      argument:
        description: Exact semantic graph node ID (no SPARQL text)
        required: true
        default: scientific:concept:00000000-0000-0000-0000-000000000002
        type: string
      repeats:
        description: Independent observed timing repetitions (1 through 7)
        required: true
        default: '3'
        type: string
      limit:
        description: Maximum query rows (1 through 100)
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  provenance-audit:
    name: Detached RDF provenance verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout requested development source, read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install source-declared dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r source/requirements.txt

      - name: Verify RI and real G4 source contracts
        env:
          PYTHONPATH: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m pytest -q \
            source/tests/semantic_graph/test_ri01_rdflib_query_layer.py \
            source/tests/semantic_graph/test_ri02_rdflib_scientific_index.py \
            source/tests/semantic_graph/test_ri03_rdflib_provenance_audit.py \
            source/tests/semantic_graph/test_g4_rdf_export.py \
            source/tests/semantic_graph/test_g4_rdf_interoperability.py \
            --junitxml=reports/ri03-contract-tests.xml

      - name: Enforce pytest no-return-value regression check
        env:
          PYTHONPATH: source
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            source/tests/semantic_graph/test_ri02_rdflib_scientific_index.py \
            -W error::pytest.PytestReturnNotNoneWarning \
            --junitxml=reports/ri02-pytest-warning-check.xml

      - name: Create detached consistency, provenance and timing report
        env:
          PYTHONPATH: source
          MODE: ${{ inputs.source_mode }}
          GRAPH_PATH: ${{ inputs.knowledge_graph_path }}
          QUERY: ${{ inputs.query }}
          ARGUMENT: ${{ inputs.argument }}
          REPEATS: ${{ inputs.repeats }}
          LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPEATS" =~ ^[1-7]$ ]]
          [[ "$LIMIT" =~ ^[0-9]+$ ]]
          (( 10#$LIMIT >= 1 && 10#$LIMIT <= 100 ))
          args=(--repository source --mode "$MODE" --query "$QUERY" \
                --argument "$ARGUMENT" --repeats "$REPEATS" --limit "$LIMIT" \
                --output-dir reports/provenance)
          if [[ "$MODE" == candidate ]]; then
            args+=(--knowledge-graph "$GRAPH_PATH")
          fi
          python -m audit_engine.semantic_audit.graph.rdflib_provenance_audit "${args[@]}" \
            > reports/build.json

      - name: Independently replay source and reparse detached RDF
        env:
          PYTHONPATH: source
          MODE: ${{ inputs.source_mode }}
          GRAPH_PATH: ${{ inputs.knowledge_graph_path }}
          QUERY: ${{ inputs.query }}
          ARGUMENT: ${{ inputs.argument }}
          REPEATS: ${{ inputs.repeats }}
          LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repository source --mode "$MODE" --query "$QUERY" \
                --argument "$ARGUMENT" --repeats "$REPEATS" --limit "$LIMIT" \
                --output-dir reports/provenance --verify)
          if [[ "$MODE" == candidate ]]; then
            args+=(--knowledge-graph "$GRAPH_PATH")
          fi
          python -m audit_engine.semantic_audit.graph.rdflib_provenance_audit "${args[@]}" \
            > reports/replay.json

      - name: Independent report digest and authority boundary audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from rdflib import Dataset
          root=Path('reports/provenance')
          raw=(root/'ri03-scientific-dataset.nq').read_bytes()
          document=(root/'ri03-audit-report.json').read_bytes()
          report=json.loads(document)
          def canonical(v):
              return (json.dumps(v,sort_keys=True,ensure_ascii=False,
                      separators=(',',':'),allow_nan=False)+'\n').encode()
          assert document==canonical(report)
          digest=report.pop('report_sha256')
          assert hashlib.sha256(canonical(report)).hexdigest()==digest
          assert hashlib.sha256(raw).hexdigest()==report['dataset_nquads_sha256']
          assert report['schema_version']=='ri03-provenance-audit-benchmark/v1'
          assert report['consistency']['status']=='consistent'
          assert report['result_count']==len(report['results'])
          assert report['result_count']<=report['query_limit']<=100
          assert len(report['named_contexts'])==5
          for flag in ('scientific_truth_established','semantic_entailment_verified',
                       'automatic_approval_permitted','authoritative_mutation_permitted',
                       'arbitrary_sparql_permitted','timings_are_cryptographic_proofs'):
              assert report[flag] is False, flag
          ds=Dataset(default_union=False)
          ds.parse(data=raw.decode('utf-8'),format='nquads')
          assert len(list(ds.quads((None,None,None,None))))==report['consistency']['total_quads']
          assert {str(c) for _,_,_,c in ds.quads((None,None,None,None))}==set(report['named_contexts'])
          print('RI-03 detached source, provenance, query and authority checks: PASS')
          PY

      - name: Upload audit artifact and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ri03-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
