name: 10 Semantic Reverification Execution Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: G3.0-G3.1.1 regression suites
        run: pytest tests/semantic_graph tests/semantic_verification tests/semantic_domain_verification -v

      - name: G3.2.0-G3.2.1 evolution regression suite
        run: pytest tests/semantic_graph_evolution -v

      - name: G3.2.2 re-verification execution suite
        run: pytest tests/semantic_reverification_execution -v

      - name: Full repository regression
        run: pytest -q

      - name: Generate G3.2.2 validation artifact
        run: python tools/validate_semantic_reverification_execution.py

      - name: Upload G3.2.2 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-reverification-execution-validation
          path: artifacts/semantic_reverification_execution_validation.json
