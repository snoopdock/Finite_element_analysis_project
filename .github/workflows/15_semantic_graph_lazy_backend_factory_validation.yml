name: 15 - Semantic Graph Lazy Backend Factory Validation

on:
  workflow_dispatch:

jobs:

  lazy-backend-factory-validation:

    name: Validate Lazy Backend Loading

    runs-on: ubuntu-latest

    steps:

      - name: Checkout stage1 development branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx scipy numpy

      - name: Validate lazy factory
        run: |

          python <<'PY'

          import sys

          from audit_engine.semantic_audit.graph.backend.backend_factory import (
              BackendFactory,
          )

          assert "networkx" not in sys.modules
          assert "scipy" not in sys.modules

          from audit_engine.semantic_audit.core.semantic_graph import (
              SemanticGraph,
          )

          graph = SemanticGraph()

          factory = BackendFactory()

          nx_adapter = factory.create(
              "networkx",
              graph,
          )

          scipy_adapter = factory.create(
              "scipy",
              graph,
          )

          assert nx_adapter.__class__.__name__ == "NetworkXAdapter"
          assert scipy_adapter.__class__.__name__ == "SciPyAdapter"

          try:
              factory.create("unknown", graph)
              raise AssertionError("Unknown backend accepted")
          except ValueError:
              pass

          print(
              "Semantic Graph Lazy Backend Factory validation passed."
          )

          PY
