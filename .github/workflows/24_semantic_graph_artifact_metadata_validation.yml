name: 24 - Semantic Graph Artifact Metadata Validation

on:
  workflow_dispatch:

jobs:

  artifact-metadata-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout stage1 development branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate artifact metadata
        run: |

          python <<'PY'

          from audit_engine.semantic_audit.graph.backend.artifact_metadata import (
              ArtifactMetadata,
          )

          metadata = ArtifactMetadata(
              schema_version="1.0",
              generated_by="SemanticGraphBackend",
              graph_version="1.0",
              execution_context={
                  "task": "semantic_analysis"
              },
          )

          data = metadata.to_dict()

          assert data["schema_version"] == "1.0"
          assert data["generated_by"] == "SemanticGraphBackend"
          assert "created_at" in data
          assert data["execution_context"]["task"] == "semantic_analysis"

          print(
              "Semantic Graph Artifact Metadata validation passed."
          )

          PY
