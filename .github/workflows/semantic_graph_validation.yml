name: Semantic Graph Core Validation


on:

  push:

    branches:

      - stage1/section-uuids


  workflow_dispatch:



jobs:

  semantic-graph-validation:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi



      - name: Validate semantic graph core
        run: |

          python - <<'PY'

          from pathlib import Path
          import json


          from audit_engine.semantic_audit.core.semantic_graph import (
              SemanticGraph,
              SemanticNode,
              SemanticEdge
          )


          from audit_engine.semantic_audit.graph.serializer import (
              serialize_graph
          )


          print("Creating semantic graph...")


          graph = SemanticGraph()



          graph.add_node(

              SemanticNode(

                  node_id="main.py",

                  entity_type="SoftwareModule"

              )

          )


          graph.add_node(

              SemanticNode(

                  node_id="research.evidence",

                  entity_type="SoftwareDependency"

              )

          )


          graph.add_edge(

              SemanticEdge(

                  source_id="main.py",

                  target_id="research.evidence",

                  relation_type="IMPORTS"

              )

          )


          output = "semantic_graph_validation.json"


          serialize_graph(

              graph,

              output

          )


          assert Path(output).exists()


          data = json.loads(

              Path(output).read_text()

          )


          assert "nodes" in data

          assert "edges" in data


          assert len(data["nodes"]) == 2

          assert len(data["edges"]) == 1


          edge = data["edges"][0]


          assert edge["source"] == "main.py"

          assert edge["target"] == "research.evidence"

          assert edge["relation"] == "IMPORTS"


          print("Semantic graph validation passed.")


          PY



      - name: Upload semantic graph artifact
        uses: actions/upload-artifact@v4

        with:

          name: semantic-graph-validation-result

          path: semantic_graph_validation.json
