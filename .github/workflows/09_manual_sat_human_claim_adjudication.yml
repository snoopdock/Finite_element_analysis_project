name: Manual SAT Human Claim Annotations

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact reviewed source commit SHA preferred; alternatively stage1/section-uuids'
        required: true
        type: string
        default: stage1/section-uuids
      query:
        description: 'Same query used to build the G3.4.20 dossier'
        required: true
        type: string
      proposed_text:
        description: 'Exactly the same multiline proposed text used for the dossier'
        required: true
        type: string
      review_json:
        description: 'JSON with dossier_sha256 and per-claim assessments (see docs)'
        required: true
        type: string
      max_results:
        description: 'Same retrieval result count used for dossier'
        required: true
        type: choice
        options: ['5', '8', '12', '20']
        default: '8'

permissions:
  contents: read

jobs:
  annotate:
    name: Generate and verify read-only human annotations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SAT_QUERY: ${{ inputs.query }}
      SAT_TEXT: ${{ inputs.proposed_text }}
      SAT_REVIEW_JSON: ${{ inputs.review_json }}
      SAT_RESULTS: ${{ inputs.max_results }}
      SAT_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout reviewed source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install review dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Prepare untrusted review input as temporary data
        run: |
          set -euo pipefail
          mkdir -p sat-human-review-artifacts
          printf '%s' "$SAT_REVIEW_JSON" > sat-human-review-artifacts/review-submission.json
      - name: Regenerate and verify original proposal audit
        run: |
          set -euo pipefail
          python source/decision_memory/proposal_audit.py --repository source --query "$SAT_QUERY" --draft-text "$SAT_TEXT" --max-results "$SAT_RESULTS" --output sat-human-review-artifacts/sat-proposal-audit.json
          python source/decision_memory/proposal_audit.py --repository source --verify-report sat-human-review-artifacts/sat-proposal-audit.json
      - name: Regenerate and verify original review dossier
        run: |
          set -euo pipefail
          python source/decision_memory/review_dossier.py --repository source --audit-file sat-human-review-artifacts/sat-proposal-audit.json --output sat-human-review-artifacts/sat-claim-review-dossier.json
          python source/decision_memory/review_dossier.py --repository source --audit-file sat-human-review-artifacts/sat-proposal-audit.json --verify-file sat-human-review-artifacts/sat-claim-review-dossier.json
      - name: Bind human annotations to verified sources
        run: |
          set -euo pipefail
          python source/decision_memory/human_adjudication.py --repository source --audit-file sat-human-review-artifacts/sat-proposal-audit.json --dossier-file sat-human-review-artifacts/sat-claim-review-dossier.json --review-file sat-human-review-artifacts/review-submission.json --github-actor "$SAT_ACTOR" --output sat-human-review-artifacts/human-review-annotations.json
      - name: Independently reverify annotations
        run: |
          set -euo pipefail
          python source/decision_memory/human_adjudication.py --repository source --audit-file sat-human-review-artifacts/sat-proposal-audit.json --dossier-file sat-human-review-artifacts/sat-claim-review-dossier.json --review-file sat-human-review-artifacts/review-submission.json --github-actor "$SAT_ACTOR" --verify-file sat-human-review-artifacts/human-review-annotations.json
      - name: Upload temporary evidence-bound review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-human-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: sat-human-review-artifacts/
          if-no-files-found: warn
          retention-days: 14
