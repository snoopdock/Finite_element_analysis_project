name: AE-32D Machine Verification (Manual)

on:
  workflow_dispatch:
    inputs:
      fixture_path:
        description: "Controlled provider-interface fixture path"
        required: true
        type: string
        default: "tests/semantic_audit/fixtures/ae32c_provider_interface_incident"
      acknowledge:
        description: "Confirm this is machine verification, not human independent adjudication"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ae32d-machine-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    if: inputs.acknowledge == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify controlled incident and reproduce expected failure
        id: verify
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          FIXTURE_PATH: ${{ inputs.fixture_path }}
        run: |
          set -euo pipefail
          python tools/ae32d_machine_verify_candidate.py \
            --fixture "$FIXTURE_PATH" \
            --output "$RUNNER_TEMP/ae32d-machine-verification/machine-verification.json"

      - name: Publish result in job summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/ae32d-machine-verification/machine-verification.json
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["REPORT"])
          print("## AE-32D machine verification", file=open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              if not p.is_file():
                  out.write("\nNo report was produced. Inspect the failing step logs.\n")
              else:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  out.write(f"\n- **Status:** `{d.get('status')}`\n")
                  out.write(f"- **Source revision:** `{d.get('source_revision')}`\n")
                  out.write(f"- **Checks passed:** {sum(x.get('status') == 'pass' for x in d.get('findings', []))}\n")
                  out.write(f"- **Errors:** `{', '.join(d.get('errors', [])) or 'none'}`\n")
                  out.write("- **Human independent adjudication:** not performed\n")
                  out.write("- **Primary benchmark eligible:** false\n")
                  out.write("\nThis action is a deterministic fixture verification, not a substitute for independent human review.\n")
          PY

      - name: Upload machine-verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae32d-machine-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/ae32d-machine-verification/
          if-no-files-found: warn
          retention-days: 90
