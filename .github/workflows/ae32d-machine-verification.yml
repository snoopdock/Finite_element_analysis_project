name: AE-32D Machine Verification and Boundary Tests

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - .github/workflows/ae32d-machine-verification.yml
      - tools/ae32d_validate_benchmark.py
      - tools/ae32d_exploratory_evaluation.py
      - tests/semantic_audit/test_ae32d_exploratory_evaluation.py
      - tests/semantic_audit/test_ae32d_ab_contract_schemas.py
      - tests/semantic_audit/test_ae32d_rule_catalog.py
      - tests/semantic_audit/test_ae32d_deterministic_rules.py
      - tests/semantic_audit/test_ae32d_pinned_rule_fixtures.py
      - tests/semantic_audit/test_ae32d_deterministic_audit.py
      - tests/semantic_audit/test_ae32d_graph_assisted_audit.py
      - tools/ae32d_trial_contracts.py
      - tools/ae32d_validate_rule_catalog.py
      - tools/ae32d_deterministic_rules.py
      - tools/ae32d_deterministic_audit.py
      - tools/ae32d_graph_assisted_audit.py
      - evaluation/ae32d/machine-reference-registry.json
      - evaluation/ae32d/machine-reference-registry.schema.json
      - evaluation/ae32d/exploratory-trials.schema.json
      - tools/ae32d_verify_case_matrix.py
      - tools/ae32d_verify_extended_cases.py
      - tests/semantic_audit/test_ae32d_extended_cases.py
      - tests/semantic_audit/test_ae32d_case_matrix.py
      - tools/ae32d_score_outcomes.py
      - tests/semantic_audit/test_ae32d_score_outcomes.py
      - tests/semantic_audit/test_ae32d_benchmark_validation.py
      - tests/semantic_audit/test_ae32d_machine_ledger.py
      - evaluation/ae32d/**
      - tools/ae32d_machine_verify_candidate.py
      - tests/semantic_audit/test_ae32d_machine_verification_boundary.py
      - tests/semantic_audit/fixtures/ae32c_provider_interface_incident/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32d-machine-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout immutable candidate source
        uses: actions/checkout@v4
        with:
          ref: afcb1cba064de6f3d680f6be3085a365c6687c7b
          path: .ae32d-candidate-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable case-matrix source
        uses: actions/checkout@v4
        with:
          ref: dd80be6e7a3e0a912beace92ce0fac446ea6ed61
          path: .ae32d-case-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable extended-case source
        uses: actions/checkout@v4
        with:
          ref: c0d700c0a2599aabda8957f54e750a812ea2ef5d
          path: .ae32d-extended-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark record validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Validate AE-32D benchmark records
        run: python tools/ae32d_validate_benchmark.py --output "$RUNNER_TEMP/ae32d-machine-verification/benchmark-validation.json"

      - name: Validate provisional machine-reference registry
        run: python tools/ae32d_exploratory_evaluation.py --validate-only --output "$RUNNER_TEMP/ae32d-machine-verification/exploratory-reference-validation.json"

      - name: Test exploratory evaluation boundaries
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_exploratory_evaluation.py' -v

      - name: Test A/B contract schemas and information boundary
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_ab_contract_schemas.py' -v

      - name: Validate deterministic A/B rule catalog
        run: python tools/ae32d_validate_rule_catalog.py --output "$RUNNER_TEMP/ae32d-machine-verification/rule-catalog-validation.json"

      - name: Test deterministic A/B rule catalog
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_rule_catalog.py' -v

      - name: Test bounded deterministic semantic rules
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_deterministic_rules.py' -v

      - name: Test deterministic rules on exact pinned fixtures
        env:
          AE32D_CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-candidate-source
          AE32D_CASE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-case-source
          AE32D_EXTENDED_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-extended-source
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_pinned_rule_fixtures.py' -v

      - name: Test deterministic condition A on pinned cases
        env:
          AE32D_CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-candidate-source
          AE32D_CASE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-case-source
          AE32D_EXTENDED_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-extended-source
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_deterministic_audit.py' -v

      - name: Test graph-assisted condition B on pinned cases
        env:
          AE32D_CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-candidate-source
          AE32D_CASE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-case-source
          AE32D_EXTENDED_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-extended-source
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_graph_assisted_audit.py' -v

      - name: Test deterministic outcome classifier
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_score_outcomes.py' -v

      - name: Test case-matrix verifier
        env:
          AE32D_CASE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-case-source
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_case_matrix.py' -v

      - name: Verify pinned case matrix
        env:
          AE32D_CASE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-case-source
        run: python tools/ae32d_verify_case_matrix.py --output "$RUNNER_TEMP/ae32d-machine-verification/case-matrix.json"

      - name: Test extended defect families
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_extended_cases.py' -v

      - name: Verify pinned extended cases
        env:
          AE32D_EXTENDED_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-extended-source
        run: python tools/ae32d_verify_extended_cases.py --output "$RUNNER_TEMP/ae32d-machine-verification/extended-cases.json"

      - name: Test machine-verification ledger
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_machine_ledger.py' -v

      - name: Test benchmark record validation
        run: python -m unittest discover -s tests/semantic_audit -p 'test_ae32d_benchmark_validation.py' -v

      - name: Test fixed-fixture execution boundary
        run: |
          python -m unittest discover \
            -s tests/semantic_audit \
            -p 'test_ae32d_machine_verification_boundary.py' \
            -v

      - name: Verify the fixed controlled incident
        id: verify
        env:
          AE32D_CANDIDATE_SOURCE_ROOT: ${{ github.workspace }}/.ae32d-candidate-source
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python tools/ae32d_machine_verify_candidate.py \
            --output "$RUNNER_TEMP/ae32d-machine-verification/machine-verification.json"

      - name: Publish result in job summary
        if: always()
        env:
          REPORT: ${{ runner.temp }}/ae32d-machine-verification/machine-verification.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["REPORT"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## AE-32D machine verification\n")
              if not p.is_file():
                  out.write("\n- Machine execution was not requested or no report was produced.\n")
              else:
                  d = json.loads(p.read_text(encoding="utf-8"))
                  out.write(f"\n- **Status:** `{d.get('status')}`\n")
                  out.write(f"- **Source revision:** `{d.get('source_revision')}`\n")
                  out.write(f"- **Checks passed:** {sum(x.get('status') == 'pass' for x in d.get('findings', []))}\n")
                  out.write(f"- **Errors:** `{', '.join(d.get('errors', [])) or 'none'}`\n")
                  out.write("- **Human independent adjudication:** not performed\n")
                  out.write("- **Primary benchmark eligible:** false\n")
                  out.write("\nThis action is a deterministic fixture verification, not a substitute for independent human review.\n")
          PY

      - name: Upload machine-verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae32d-machine-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/ae32d-machine-verification/
          if-no-files-found: warn
          retention-days: 90
