name: 19 - Semantic Graph Pipeline Result Validation

on:

  workflow_dispatch:


jobs:

  pipeline-result-validation:

    name: Validate Pipeline Result Integration

    runs-on: ubuntu-latest

    steps:

      - name: Checkout stage1 development branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx scipy numpy

      - name: Validate pipeline result
        run: |

          python <<'PY'

          from audit_engine.semantic_audit.core.semantic_graph import (
              SemanticGraph,
          )

          from audit_engine.semantic_audit.graph.backend.backend_pipeline import (
              BackendPipeline,
          )

          from audit_engine.semantic_audit.graph.backend.backend_selector import (
              BackendSelectionPolicy,
          )

          from audit_engine.semantic_audit.graph.backend.capability_registry import (
              create_default_registry,
          )

          from audit_engine.semantic_audit.graph.backend.backend_factory import (
              BackendFactory,
          )

          from audit_engine.semantic_audit.graph.backend.execution_context import (
              BackendExecutionContext,
          )


          graph = SemanticGraph()


          context = BackendExecutionContext(
              graph=graph,
              task_type="semantic_analysis",
          )


          pipeline = BackendPipeline(
              BackendSelectionPolicy(
                  create_default_registry()
              ),
              BackendFactory(),
          )


          result = pipeline.execute(
              {
                  "metadata": True,
                  "multiedges": True,
              },
              context,
          )


          assert result.backend == "networkx"

          assert result.metadata["task_type"] == (
              "semantic_analysis"
          )

          assert result.loss_report["lossless"] is True


          print(
              "Semantic Graph Pipeline Result Integration validation passed."
          )

          PY
