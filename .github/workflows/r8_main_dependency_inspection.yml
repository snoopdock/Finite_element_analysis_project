name: R8 main dependency inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Show evidence dependency usage
        run: |
          echo "=== import locations ==="
          grep -n "research.evidence" main.py || true

          echo "=== summary function usage ==="
          grep -n "get_reading_summary" main.py || true

          echo "=== surrounding context ==="
          python - <<'PY'
          from pathlib import Path

          lines = Path("main.py").read_text().splitlines()

          for i,line in enumerate(lines,1):
              if "get_reading_summary" in line:
                  start=max(1,i-10)
                  end=min(len(lines),i+10)

                  print(
                      f"\n--- lines {start}-{end} ---"
                  )

                  for n in range(start,end+1):
                      print(f"{n}: {lines[n-1]}")
          PY
