name: R8 main dependency context inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Inspect main dependency context
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("main.py")

          if not path.exists():
              raise SystemExit("main.py not found")

          lines = path.read_text().splitlines()

          targets = [
              "research.evidence",
              "get_reading_summary",
          ]

          for index, line in enumerate(lines, 1):
              if any(target in line for target in targets):

                  start=max(1,index-20)
                  end=min(len(lines),index+20)

                  print("\n==============================")
                  print(f"Context {start}-{end}")
                  print("==============================")

                  for number in range(start,end+1):
                      print(
                          f"{number}: {lines[number-1]}"
                      )
          PY
