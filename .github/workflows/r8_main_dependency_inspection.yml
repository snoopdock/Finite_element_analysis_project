name: R8 main dependency inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Inspect research evidence dependency
        run: |
          echo "=== imports ==="
          grep -n "research.evidence" main.py || true

          echo
          echo "=== summary usage ==="
          grep -n "get_reading_summary" main.py || true

          echo
          echo "=== surrounding code ==="

          python - <<'PY'
          from pathlib import Path

          lines = Path("main.py").read_text().splitlines()

          for i, line in enumerate(lines, 1):
              if (
                  "research.evidence" in line
                  or "get_reading_summary" in line
              ):
                  start=max(1, i-15)
                  end=min(len(lines), i+15)

                  print(
                      f"\n--- context {start}:{end} ---"
                  )

                  for n in range(start,end+1):
                      print(f"{n}: {lines[n-1]}")
          PY
