name: AE-32C M7.5.20 Downstream Qualification Currentness Consumer Gate

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_20_qualification_consumer_gate.yml"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m7520_*.py"
      - "tests/semantic_graph/test_m7519_*.py"
      - "tests/semantic_graph/test_m7518_*.py"
      - "tests/semantic_graph/test_m7517_*.py"
      - "docs/audit-engine/AE-32C-M7.5.20-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32c-m7520-stage1
  cancel-in-progress: false

jobs:
  qualification-consumer-currentness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile epistemic implementation
        run: python -m compileall -q audit_engine/semantic_audit/epistemic
      - name: Dedicated M7.5.20 consumer-gate tests
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7520_*.py' -v
      - name: M7.5.19 currentness regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7519_*.py' -v
      - name: M7.5.18 persistence regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7518_*.py' -v
      - name: M7.5.17 semantic reconciliation regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m7517_*.py' -v
      - name: Complete M7.5 regression
        run: python -m unittest discover -s tests/semantic_graph -p 'test_m75*.py' -v
      - name: Consumer authority boundary
        if: always()
        run: |
          {
            echo "## M7.5.20 downstream qualification currentness consumer gate"
            echo "- Every recorded consumer preflight follows M7.5.19 currentness evaluation"
            echo "- Invalidated reconciliations produce BLOCKED_INVALIDATED"
            echo "- CURRENTNESS_CONFIRMED is not evidence acceptance or authorization"
            echo "- Consumer identity and operation are caller-declared, not authenticated"
            echo "- Separate ledgers are not atomically coupled; TOCTOU remains out of scope"
          } >> "$GITHUB_STEP_SUMMARY"
