name: Semantic Audit Engine

on:
  workflow_dispatch:

jobs:

  semantic-audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run semantic mapper
        run: |
          python -m audit_engine.runner

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-audit-inventory
          path: semantic_audit_inventory.json
