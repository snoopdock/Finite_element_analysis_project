name: Semantic Audit Engine

on:

  workflow_dispatch:


jobs:

  semantic-audit:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4

        with:
          ref: stage1/section-uuids



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"



      - name: Run semantic audit

        run:

          python -m semantic_audit.runner



      - name: Validate report

        run:

          test -f semantic_audit_report.json



      - name: Print findings

        run:

          python - <<'PY'

          import json

          data=json.load(
              open(
              "semantic_audit_report.json"
              )
          )

          for item in data["findings"]:

              if item["classification"] != "UNCLASSIFIED":

                  print(item)

          PY



      - name: Upload report

        uses: actions/upload-artifact@v4

        with:

          name: semantic-audit-report

          path: semantic_audit_report.json
