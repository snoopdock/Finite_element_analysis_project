
name: Semantic Audit Engine

on:

  workflow_dispatch:

  push:
    branches:
      - stage1/section-uuids


jobs:

  semantic-audit:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          ref: stage1/section-uuids



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install pyyaml



      - name: Verify audit engine structure

        run: |

          find audit_engine -maxdepth 3 -type f | sort



      - name: Run semantic audit engine

        run: |

          python -m audit_engine.semantic_audit.runner



      - name: Verify generated report

        run: |

          test -f semantic_audit_report.json



      - name: Display report summary

        run: |

          python - <<'PY'

          import json


          with open(
              "semantic_audit_report.json"
          ) as f:

              report=json.load(f)


          print("Imports:",
                len(report["imports"]))


          print("Symbols:",
                len(report["symbols"]))


          print("Findings:",
                len(report["findings"]))


          for finding in report["findings"]:

              print(
                  finding
              )

          PY



      - name: Upload semantic audit artifact

        uses: actions/upload-artifact@v4

        with:

          name: semantic-audit-report

          path:

            semantic_audit_report.json
