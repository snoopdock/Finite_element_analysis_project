name: 17 - Semantic Graph Backend Execution Result Contract Validation


on:

  workflow_dispatch:


jobs:


  execution-result-validation:


    name: Validate Backend Execution Result Contract


    runs-on: ubuntu-latest


    steps:


      - name: Checkout stage1 development branch

        uses: actions/checkout@v4

        with:

          ref: stage1/section-uuids



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Validate execution result

        run: |


          python <<'PY'


          from audit_engine.semantic_audit.graph.backend.execution_result import (
              BackendExecutionResult,
          )



          result = BackendExecutionResult(

              backend="networkx",

              output="graph_object",

              metadata={
                  "nodes": 2
              },

              provenance={
                  "source": "semantic_graph"
              },

              transformations=[
                  "semantic_projection"
              ],

              loss_report={
                  "lossless": True
              },

          )



          summary = result.summary()



          assert summary["backend"] == "networkx"

          assert summary["metadata"]["nodes"] == 2

          assert summary["loss_report"]["lossless"] is True



          print(
              "Semantic Graph Backend Execution Result Contract validation passed."
          )


          PY
