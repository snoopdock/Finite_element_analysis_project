name: 22 - Semantic Graph Provenance Serialization Validation


on:

  workflow_dispatch:


jobs:


  provenance-serialization-validation:


    name: Validate Provenance Serialization


    runs-on: ubuntu-latest


    steps:


      - name: Checkout stage1 development branch

        uses: actions/checkout@v4

        with:

          ref: stage1/section-uuids



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Validate serialization

        run: |


          python <<'PY'


          from audit_engine.semantic_audit.graph.backend.execution_result import (
              BackendExecutionResult,
          )

          from audit_engine.semantic_audit.graph.backend.provenance import (
              ProvenanceRecord,
              TransformationRecord,
              LossAssessment,
          )

          from audit_engine.semantic_audit.graph.backend.provenance_serializer import (
              ProvenanceSerializer,
          )


          result = BackendExecutionResult(

              backend="networkx",

              output="graph",

              provenance_records=[
                  ProvenanceRecord(
                      source="SemanticGraph",
                      backend="networkx",
                  )
              ],

              transformation_records=[
                  TransformationRecord(
                      operation="projection",
                      input_type="SemanticGraph",
                      output_type="NetworkXGraph",
                  )
              ],

              loss_assessment=LossAssessment(
                  lossless=True
              ),

          )


          data = ProvenanceSerializer.to_dict(result)

          assert data["backend"] == "networkx"

          assert len(data["provenance"]) == 1

          assert len(data["transformations"]) == 1

          assert data["loss_assessment"]["lossless"] is True


          json_output = ProvenanceSerializer.to_json(result)

          assert "networkx" in json_output


          print(
              "Semantic Graph Provenance Serialization validation passed."
          )


          PY
