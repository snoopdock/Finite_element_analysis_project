name: Manual SAT Decision Memory Context Retrieval

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Development branch containing decision memory
        required: true
        type: string
        default: stage1/section-uuids
      query:
        description: Text to search in recorded decisions, actions, outcomes and candidate rules
        required: true
        type: string
      max_results:
        description: Maximum results (1-20)
        required: true
        type: choice
        options: ['5', '8', '12', '20']
        default: '8'

permissions:
  contents: read

jobs:
  retrieve:
    name: Read-only SAT context retrieval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MEMORY_QUERY: ${{ inputs.query }}
      MEMORY_LIMIT: ${{ inputs.max_results }}
    steps:
      - name: Checkout selected development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install retrieval dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Prepare output directory
        run: mkdir -p context-artifacts

      - name: Retrieve grounded decision context
        run: |
          set -euo pipefail
          python source/decision_memory/context_retrieval.py \
            --repository source \
            --query "$MEMORY_QUERY" \
            --max-results "$MEMORY_LIMIT" \
            --output context-artifacts/sat-context.json

      - name: Upload SAT context (short-term transport only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-memory-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: context-artifacts/sat-context.json
          if-no-files-found: warn
          retention-days: 14
