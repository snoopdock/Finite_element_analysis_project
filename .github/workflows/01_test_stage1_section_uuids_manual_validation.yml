name: "01 | Test | stage1-section-uuids | Manual Validation"

on:
  workflow_dispatch:
    inputs:
      test_expression:
        description: "Optional pytest expression"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pytest:
    name: "pytest validation - stage1/section-uuids"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stage1/section-uuids
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        run: |
          if [ -n "${{ github.event.inputs.test_expression }}" ]; then
            pytest -k "${{ github.event.inputs.test_expression }}" -v
          else
            pytest -v
          fi
