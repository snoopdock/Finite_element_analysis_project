name: Validate LaTeX document pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-latex-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi
          python -m pip install pytest

      - name: Run LaTeX document tests
        id: latex_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_document_model.py \
            tests/test_semantic_markers.py \
            tests/test_document_assembler.py \
            tests/test_section_document_adapter.py \
            tests/test_semantic_writer_boundary.py \
            tests/test_document_persistence.py \
            tests/test_document_snapshot.py \
            tests/test_document_renderer_boundary.py 2>&1 | tee latex-tests.log

      - name: Run KaTeX validation tests
        id: katex_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t katex_tests < <(find tests -type f \( \
            -iname '*katex*.py' -o \
            -iname 'test_*math*.py' \
          \) -print | sort)

          if [ "${#katex_tests[@]}" -eq 0 ]; then
            echo "No KaTeX-specific test files were found." | tee katex-tests.log
            exit 0
          fi

          printf 'Running KaTeX-related tests:\n%s\n' "${katex_tests[@]}" | tee katex-tests.log
          python -m pytest -q "${katex_tests[@]}" 2>&1 | tee -a katex-tests.log

      - name: Collect test diagnostics
        if: always()
        run: |
          {
            echo "=== GitHub Actions context ==="
            echo "Commit: $GITHUB_SHA"
            echo "Branch/ref: $GITHUB_REF"
            echo "Runner OS: $RUNNER_OS"
            echo "Python:"
            python --version || true
            echo
            echo "=== LaTeX test result ==="
            echo "outcome=${{ steps.latex_tests.outcome }}"
            echo
            echo "=== KaTeX test result ==="
            echo "outcome=${{ steps.katex_tests.outcome }}"
            echo
            echo "=== LaTeX tests log ==="
            cat latex-tests.log 2>/dev/null || true
            echo
            echo "=== KaTeX tests log ==="
            cat katex-tests.log 2>/dev/null || true
          } > latex-runtime-log.txt

      - name: Print test diagnostics
        if: always()
        run: |
          echo "================ LATEX RUNTIME LOG ================"
          cat latex-runtime-log.txt
          echo "============== END LATEX RUNTIME LOG =============="

      - name: Upload LaTeX test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-document-test-log
          path: |
            latex-runtime-log.txt
            latex-tests.log
            katex-tests.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if LaTeX tests failed
        if: steps.latex_tests.outcome == 'failure'
        run: |
          echo "The LaTeX document tests failed. Download the latex-document-test-log artifact for diagnostics."
          exit 1

      - name: Fail workflow if KaTeX tests failed
        if: steps.katex_tests.outcome == 'failure'
        run: |
          echo "The KaTeX validation tests failed. Download the latex-document-test-log artifact for diagnostics."
          exit 1
