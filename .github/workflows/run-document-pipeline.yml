name: Validate LaTeX document pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-latex-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m pip install .
          fi
          python -m pip install pytest

      - name: Run LaTeX document tests
        id: latex_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_document_model.py \
            tests/test_semantic_markers.py \
            tests/test_document_assembler.py \
            tests/test_section_document_adapter.py \
            tests/test_semantic_writer_boundary.py \
            tests/test_document_persistence.py \
            tests/test_document_snapshot.py \
            tests/test_document_renderer_boundary.py 2>&1 | tee latex-tests.log

      - name: Discover document pipeline implementation
        id: pipeline_discovery
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "=== Candidate pipeline files ==="
            find . -maxdepth 4 -type f \
              \( -name '*.py' -o -name '*.tex' -o -name '*.yml' -o -name '*.yaml' \) \
              | sort
            echo
            echo "=== LaTeX and document-pipeline references ==="
            grep -RInE \
              'latex|LaTeX|\\.tex|pdflatex|xelatex|lualatex|DocumentAssembler|DocumentRenderer|persist_pipeline_document|render|compile' \
              --include='*.py' --include='*.tex' --include='*.yml' --include='*.yaml' \
              --exclude-dir=.git . || true
            echo
            echo "=== Candidate integration tests ==="
            find tests tools -maxdepth 4 -type f 2>/dev/null \
              | grep -Ei 'pipeline|integration|render|latex|document' \
              | sort || true
            echo
            echo "=== TeX executables available on runner ==="
            command -v pdflatex || true
            command -v xelatex || true
            command -v lualatex || true
          } | tee latex-pipeline-discovery.log

      - name: Collect test diagnostics
        if: always()
        run: |
          {
            echo "=== GitHub Actions context ==="
            echo "Commit: $GITHUB_SHA"
            echo "Branch/ref: $GITHUB_REF"
            echo "Runner OS: $RUNNER_OS"
            echo "Python:"
            python --version || true
            echo
            echo "=== LaTeX test result ==="
            echo "outcome=${{ steps.latex_tests.outcome }}"
            echo
            echo "=== Pipeline discovery result ==="
            echo "outcome=${{ steps.pipeline_discovery.outcome }}"
            echo
            echo "=== LaTeX tests log ==="
            cat latex-tests.log 2>/dev/null || true
            echo
            echo "=== Pipeline discovery log ==="
            cat latex-pipeline-discovery.log 2>/dev/null || true
          } > latex-runtime-log.txt

      - name: Print test diagnostics
        if: always()
        run: |
          echo "================ LATEX RUNTIME LOG ================"
          cat latex-runtime-log.txt
          echo "============== END LATEX RUNTIME LOG =============="

      - name: Upload LaTeX test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-document-test-log
          path: |
            latex-runtime-log.txt
            latex-tests.log
            latex-pipeline-discovery.log
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow if LaTeX tests failed
        if: steps.latex_tests.outcome == 'failure'
        run: |
          echo "The LaTeX document tests failed. Download the latex-document-test-log artifact for diagnostics."
          exit 1
