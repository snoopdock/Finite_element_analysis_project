name: 23 - Semantic Graph Provenance Artifact Validation


on:

  workflow_dispatch:


jobs:


  provenance-artifact-validation:


    name: Validate Provenance Artifact Generation


    runs-on: ubuntu-latest


    steps:


      - name: Checkout stage1 development branch

        uses: actions/checkout@v4

        with:

          ref: stage1/section-uuids



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Validate artifact generation

        run: |


          python <<'PY'


          from pathlib import Path


          from audit_engine.semantic_audit.graph.backend.execution_result import (
              BackendExecutionResult,
          )


          from audit_engine.semantic_audit.graph.backend.provenance import (
              ProvenanceRecord,
              TransformationRecord,
              LossAssessment,
          )


          from audit_engine.semantic_audit.graph.backend.provenance_artifact import (
              ProvenanceArtifactWriter,
          )


          result = BackendExecutionResult(

              backend="networkx",

              output="graph",

              provenance_records=[
                  ProvenanceRecord(
                      source="SemanticGraph",
                      backend="networkx",
                  )
              ],

              transformation_records=[
                  TransformationRecord(
                      operation="projection",
                      input_type="SemanticGraph",
                      output_type="NetworkXGraph",
                  )
              ],

              loss_assessment=LossAssessment(
                  lossless=True
              ),

          )


          output = Path(
              "provenance_artifact.json"
          )


          writer = ProvenanceArtifactWriter()


          writer.write_json(
              result,
              output,
          )


          assert output.exists()


          content = output.read_text(
              encoding="utf-8"
          )


          assert "networkx" in content


          print(
              "Semantic Graph Provenance Artifact validation passed."
          )


          PY
