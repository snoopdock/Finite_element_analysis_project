name: AE-32C M7.1 Five-Backend Native Smoke Benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m7_1_manual_native_backend_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-check:
    name: Confirm M7.1 workflow registration
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm GitHub parsed and started this workflow
        run: |
          set -euo pipefail
          echo "M7.1 workflow registration is operational."
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
