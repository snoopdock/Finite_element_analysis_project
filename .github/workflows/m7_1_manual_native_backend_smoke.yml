name: AE-32C M7.1 Five-Backend Native Smoke Benchmark
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Stage1 branch, tag, or full commit SHA to benchmark"
        required: true
        type: string
        default: "stage1/section-uuids"
      repeats:
        description: "Timed repetitions per query (allowed: 3, 5, 7, 10, 15)"
        required: true
        type: choice
        options: ["3", "5", "7", "10", "15"]
        default: "5"
      warmup:
        description: "Warm-up calls per query (allowed: 0, 1, 2, 3, 5)"
        required: true
        type: choice
        options: ["0", "1", "2", "3", "5"]
        default: "2"
  push:
    branches:
      - stage1/section-uuids
    paths:
      - "tools/gb05_native_backend_performance_benchmark.py"
      - "tests/semantic_graph/test_m7_native_backend_performance_benchmark.py"
      - ".github/workflows/m7_1_manual_native_backend_smoke.yml"

permissions:
  contents: read

concurrency:
  group: ae32c-m7-native-smoke
  cancel-in-progress: false

jobs:
  workflow-lint:
    name: Lint M7.1 workflow definition
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go for actionlint
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate complete GitHub Actions workflow
        run: |
          "$(go env GOPATH)/bin/actionlint" -color -verbose .github/workflows/m7_1_manual_native_backend_smoke.yml

  resolve-source:
    needs: workflow-lint
    name: Resolve immutable source revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      repeats: ${{ steps.resolve.outputs.repeats }}
      warmup: ${{ steps.resolve.outputs.warmup }}
    steps:
      - name: Checkout requested source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Resolve and publish exact source SHA
        id: resolve
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.source_ref || github.sha }}
          REPEATS_INPUT: ${{ github.event.inputs.repeats }}
          WARMUP_INPUT: ${{ github.event.inputs.warmup }}
        run: |
          set -euo pipefail
          test -n "$REQUESTED_REF"
          REPEATS="${REPEATS_INPUT:-5}"
          WARMUP="${WARMUP_INPUT:-2}"
          case "$REPEATS" in 3|5|7|10|15) ;; *) echo "Invalid repeats: $REPEATS" >&2; exit 2 ;; esac
          case "$WARMUP" in 0|1|2|3|5) ;; *) echo "Invalid warmup: $WARMUP" >&2; exit 2 ;; esac
          SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "source_sha=$SOURCE_SHA"
            echo "repeats=$REPEATS"
            echo "warmup=$WARMUP"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### M7.1 source resolution"
            echo "- Requested ref: $REQUESTED_REF"
            echo "- Immutable source SHA: $SOURCE_SHA"
            echo "- Requested timed repetitions per query: $REPEATS"
            echo "- Requested warm-up calls per query: $WARMUP"
            echo "- Benchmark scope: fixed E.8.5 adversarial fixture; seven shared queries"
            echo "- This workflow is a five-backend smoke comparison, not the M7.2 workload campaign."
          } >> "$GITHUB_STEP_SUMMARY"

  pip-native-backends:
    name: Native smoke — ${{ matrix.backend }}
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [networkx, scipy, igraph]
    steps:
      - name: Checkout exact resolved source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Record source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies and native backend
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt
          if [[ "$BACKEND" == igraph ]]; then
            python -m pip install 'igraph>=0.11,<2.0'
          fi
          python -m pip check
      - name: Test M7 integrity timing report contract
        if: matrix.backend == 'networkx'
        run: |
          PYTHONPATH=source python -m pytest -q source/tests/semantic_graph/test_m7_native_backend_performance_benchmark.py
      - name: Capture runner and dependency provenance
        shell: bash
        env:
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "source_sha=$AE32C_SOURCE_REVISION"
            echo "requested_repeats=$REPEATS"
            echo "requested_warmup=$WARMUP"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)"
            echo "backend=${{ matrix.backend }}"
          } > reports/runner-environment.txt
          python -m pip freeze > reports/pip-freeze.txt
      - name: Run parity-gated native benchmark and independent report verification
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          PYTHONPATH=source python source/tools/gb05_native_backend_performance_benchmark.py run \
            --backend "$BACKEND" --repeats "$REPEATS" --warmup "$WARMUP" \
            --report "reports/m7-$BACKEND.json" 2>&1 | tee "reports/m7-$BACKEND-run.log"
          python -c 'import json, os; p=json.load(open("reports/m7-"+os.environ["BACKEND"]+".json", encoding="utf-8")); c=p.get("configuration", {}); expected={"repeats": int(os.environ["REPEATS"]), "warmup": int(os.environ["WARMUP"])}; assert c == expected, f"report configuration mismatch: expected {expected}, got {c}"'
          PYTHONPATH=source python source/tools/gb05_native_backend_performance_benchmark.py verify \
            --report "reports/m7-$BACKEND.json" 2>&1 | tee "reports/m7-$BACKEND-verify.log"
      - name: Publish backend result summary
        if: always()
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          {
            echo "### M7.1 $BACKEND"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Native query mode: recorded in the JSON report"
            echo "- Report: reports/m7-$BACKEND.json"
            echo "- Interpretation: smoke evidence only; no cross-runner ranking or winner."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backend benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-1-native-smoke-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  graph-tool-native:
    name: Native smoke — graph-tool
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # GitHub-hosted runners are heterogeneous; use conda-forge's generic x86-64 build.
      CONDA_OVERRIDE_ARCHSPEC: x86_64
    steps:
      - name: Checkout exact resolved source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Record source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Provision graph-tool environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: source/.github/environments/e85-graph-tool.yml
          environment-name: ae32c-m7-graph-tool
          cache-environment: true
          init-shell: bash
      - name: Assert portable graph-tool binary target
        shell: micromamba-shell {0}
        run: |
          set -euo pipefail
          PACKAGE="$(conda list --explicit | grep 'graph-tool-base-' | tail -n 1)"
          case "$PACKAGE" in
            *"_100.conda") echo "Verified generic x86-64 graph-tool build: $PACKAGE" ;;
            *)
              echo "Expected generic x86-64 graph-tool-base build (_100), got: $PACKAGE" >&2
              exit 1
              ;;
          esac
      - name: Capture runner and dependency provenance
        shell: bash
        env:
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "source_sha=$AE32C_SOURCE_REVISION"
            echo "requested_repeats=$REPEATS"
            echo "requested_warmup=$WARMUP"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)"
            echo "backend=snap"
            cat worker-image.txt
          } > reports/runner-environment.txt
          python -m pip freeze > reports/pip-freeze.txt
      - name: Run parity-gated SNAP worker benchmark and independent verification
        shell: bash
        env:
          PYTHONPATH: source
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python source/tools/gb05_native_backend_performance_benchmark.py run \
            --backend snap --repeats "$REPEATS" --warmup "$WARMUP" \
            --report reports/m7-snap.json 2>&1 | tee reports/m7-snap-run.log
          python -c 'import json, os; p=json.load(open("reports/m7-snap.json", encoding="utf-8")); c=p.get("configuration", {}); expected={"repeats": int(os.environ["REPEATS"]), "warmup": int(os.environ["WARMUP"])}; assert c == expected, f"report configuration mismatch: expected {expected}, got {c}"'
          python source/tools/gb05_native_backend_performance_benchmark.py verify \
            --report reports/m7-snap.json 2>&1 | tee reports/m7-snap-verify.log
      - name: Upload SNAP worker benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-1-native-smoke-snap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            worker-image.txt
          if-no-files-found: warn
          retention-days: 30

  benchmark-summary:
    name: Five-backend M7.1 smoke summary
    if: always()
    needs: [resolve-source, pip-native-backends, graph-tool-native, snap-isolated-worker]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce all five backend smoke jobs
        shell: bash
        env:
          SOURCE_RESOLUTION: ${{ needs.resolve-source.result }}
          PIP_BACKENDS: ${{ needs.pip-native-backends.result }}
          GRAPH_TOOL: ${{ needs.graph-tool-native.result }}
          SNAP: ${{ needs.snap-isolated-worker.result }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          {
            echo "## M7.1 five-backend smoke outcome"
            echo "- Immutable source SHA: $SOURCE_SHA"
            echo "- Requested timed repetitions per query: $REPEATS"
            echo "- Requested warm-up calls per query: $WARMUP"
            echo "- NetworkX / SciPy / igraph job: $PIP_BACKENDS"
            echo "- graph-tool job: $GRAPH_TOOL"
            echo "- SNAP isolated-worker job: $SNAP"
            echo "- These are independent smoke reports on separate runner instances."
            echo "- Runner and CPU provenance must be examined before any timing comparison."
            echo "- No universal winner, automatic backend selection, scientific approval, or production approval is established."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SOURCE_RESOLUTION" != success || "$PIP_BACKENDS" != success || \
                "$GRAPH_TOOL" != success || "$SNAP" != success ]]; then
            exit 1
          fi
  snap-isolated-worker:
    name: Native smoke — SNAP 6.0 isolated worker
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AE32C_SNAP_WORKER_IMAGE: ae32c-snap-worker:m7
    steps:
      - name: Checkout exact resolved source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Record source identity
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Set up Python 3.11 orchestrator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install orchestrator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt
          python -m pip check
      - name: Build restricted SNAP 6.0 worker image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --file source/.github/snap-worker/Dockerfile \
            --tag "$AE32C_SNAP_WORKER_IMAGE" source
          docker image inspect "$AE32C_SNAP_WORKER_IMAGE" \
            --format 'worker_image_id={{.Id}}' > worker-image.txt
      - name: Capture runner and dependency provenance
        shell: bash
        env:
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo "source_sha=$AE32C_SOURCE_REVISION"
            echo "requested_repeats=$REPEATS"
            echo "requested_warmup=$WARMUP"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "python=$(python --version 2>&1)"
            echo "uname=$(uname -a)"
            echo "cpu_model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs || true)"
            echo "backend=snap"
            cat worker-image.txt
          } > reports/runner-environment.txt
          python -m pip freeze > reports/pip-freeze.txt
      - name: Run parity-gated SNAP worker benchmark and independent verification
        shell: bash
        env:
          PYTHONPATH: source
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python source/tools/gb05_native_backend_performance_benchmark.py run \
            --backend snap --repeats "$REPEATS" --warmup "$WARMUP" \
            --report reports/m7-snap.json 2>&1 | tee reports/m7-snap-run.log
          python -c 'import json, os; p=json.load(open("reports/m7-snap.json", encoding="utf-8")); c=p.get("configuration", {}); expected={"repeats": int(os.environ["REPEATS"]), "warmup": int(os.environ["WARMUP"])}; assert c == expected, f"report configuration mismatch: expected {expected}, got {c}"'
          python source/tools/gb05_native_backend_performance_benchmark.py verify \
            --report reports/m7-snap.json 2>&1 | tee reports/m7-snap-verify.log
      - name: Upload SNAP worker benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-1-native-smoke-snap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/
            worker-image.txt
          if-no-files-found: warn
          retention-days: 30

  benchmark-summary:
    name: Five-backend M7.1 smoke summary
    if: always()
    needs: [resolve-source, pip-native-backends, graph-tool-native, snap-isolated-worker]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce all five backend smoke jobs
        shell: bash
        env:
          SOURCE_RESOLUTION: ${{ needs.resolve-source.result }}
          PIP_BACKENDS: ${{ needs.pip-native-backends.result }}
          GRAPH_TOOL: ${{ needs.graph-tool-native.result }}
          SNAP: ${{ needs.snap-isolated-worker.result }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
          REPEATS: ${{ needs.resolve-source.outputs.repeats }}
          WARMUP: ${{ needs.resolve-source.outputs.warmup }}
        run: |
          {
            echo "## M7.1 five-backend smoke outcome"
            echo "- Immutable source SHA: $SOURCE_SHA"
            echo "- Requested timed repetitions per query: $REPEATS"
            echo "- Requested warm-up calls per query: $WARMUP"
            echo "- NetworkX / SciPy / igraph job: $PIP_BACKENDS"
            echo "- graph-tool job: $GRAPH_TOOL"
            echo "- SNAP isolated-worker job: $SNAP"
            echo "- These are independent smoke reports on separate runner instances."
            echo "- Runner and CPU provenance must be examined before any timing comparison."
            echo "- No universal winner, automatic backend selection, scientific approval, or production approval is established."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SOURCE_RESOLUTION" != success || "$PIP_BACKENDS" != success || \
                "$GRAPH_TOOL" != success || "$SNAP" != success ]]; then
            exit 1
          fi
