name: Branch Graphify Analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      - "branch-graphify-results/**"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: branch-graphify-analysis-main
  cancel-in-progress: false

jobs:
  map-branches:
    name: Map main and stage1/section-uuids
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/branch-graphify/requirements.txt

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/branch-graphify/requirements.txt
          graphify --help

      - name: Fetch branch refs
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git show-ref --verify refs/remotes/origin/main
          git show-ref --verify refs/remotes/origin/stage1/section-uuids

      - name: Build Graphify maps and Git comparison
        run: |
          python tools/branch-graphify/run_analysis.py \
            --repo . \
            --base main \
            --compare stage1/section-uuids \
            --output branch-graphify-results/latest

      - name: Publish analysis results to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add branch-graphify-results/latest
          if git diff --cached --quiet; then
            echo "Analysis results are unchanged; nothing to commit."
          else
            git commit -m "Update Graphify branch analysis [skip ci]"
            git push origin HEAD:main
          fi
