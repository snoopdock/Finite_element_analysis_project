name: Branch Graphify Analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      - "branch-graphify-results/**"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: branch-graphify-analysis
  cancel-in-progress: false

jobs:
  map-branches:
    name: Build independent branch snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/branch-graphify/requirements.txt

      - name: Install Graphify
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/branch-graphify/requirements.txt
          graphify --help

      - name: Fetch and pin branch snapshots
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          stage1_sha="$(git rev-parse refs/remotes/origin/stage1/section-uuids)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "stage1_sha=$stage1_sha" >> "$GITHUB_OUTPUT"
          printf 'main: %s\nstage1/section-uuids: %s\n' "$main_sha" "$stage1_sha"

      - name: Build independent Graphify snapshots
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/branch-graphify-results/latest"
          python tools/branch-graphify/run_analysis.py \
            --repo . \
            --branch main \
            --commit "${{ steps.refs.outputs.main_sha }}" \
            --output "$output_root/main"
          python tools/branch-graphify/run_analysis.py \
            --repo . \
            --branch stage1/section-uuids \
            --commit "${{ steps.refs.outputs.stage1_sha }}" \
            --output "$output_root/stage1-section-uuids"

      - name: Publish per-branch analysis artifacts to main
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/branch-graphify-results/latest/main/run-metadata.json"
          test -s "$RUNNER_TEMP/branch-graphify-results/latest/stage1-section-uuids/run-metadata.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p branch-graphify-results
          rm -rf branch-graphify-results/latest
          cp -a "$RUNNER_TEMP/branch-graphify-results/latest" branch-graphify-results/latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A branch-graphify-results/latest
          if git diff --cached --quiet; then
            echo "Per-branch Graphify snapshots are unchanged; nothing to commit."
          else
            git commit -m "Update independent Graphify branch snapshots [skip ci]"
            git push origin HEAD:main
          fi
