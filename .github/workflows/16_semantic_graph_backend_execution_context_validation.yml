name: 16 - Semantic Graph Backend Execution Context Validation

on:
  workflow_dispatch:

jobs:
  execution-context-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout stage1 development branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx scipy numpy

      - name: Validate execution context
        run: |
          python <<'PY'

          from audit_engine.semantic_audit.core.semantic_graph import SemanticGraph
          from audit_engine.semantic_audit.graph.backend.execution_context import BackendExecutionContext
          from audit_engine.semantic_audit.graph.backend.backend_factory import BackendFactory

          graph = SemanticGraph()

          context = BackendExecutionContext(
              graph=graph,
              task_type="scientific_reasoning",
              preserve_metadata=True,
              provenance_tracking=True,
              validation_mode=True,
          )

          adapter = BackendFactory().create(
              "networkx",
              context,
          )

          assert adapter.__class__.__name__ == "NetworkXAdapter"
          assert context.task_type == "scientific_reasoning"
          assert context.provenance_tracking is True

          print("Semantic Graph Backend Execution Context validation passed.")

          PY
