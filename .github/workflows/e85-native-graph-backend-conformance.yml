name: AE-32C Native Graph Backend Conformance (E.8.5 / E.8.8)
run-name: AE-32C native graph backend conformance — Stage1

on:
  workflow_dispatch:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/e85-native-graph-backend-conformance.yml"
      - ".github/snap-worker/**"
      - ".github/environments/e85-snap-python39-requirements.txt"
      - "audit_engine/semantic_audit/graph/backend/**"
      - "tools/gb03_native_backend_conformance.py"
      - "tools/gb04_repository_backend_conformance.py"
      - "tools/snap_worker.py"
      - "tests/semantic_graph/**"
      - "requirements.txt"
      - "pyproject.toml"

permissions:
  contents: read

# The final source SHA is stamped into every E.8.5/E.8.8 report; docs-only edits do not retrigger this expensive matrix.
concurrency:
  group: e85-native-graph-backend-conformance-stage1-final
  cancel-in-progress: true

jobs:
  pip-native-backends:
    name: Native conformance — ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [networkx, scipy, igraph]
    steps:
      - name: Checkout Stage1 source branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids
      - name: Record selected source revision
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Selected source ref: stage1/section-uuids"
          echo "Checked-out source SHA: $SOURCE_SHA"
          {
            echo "Selected source ref: stage1/section-uuids"
            echo "Checked-out source SHA: $SOURCE_SHA"
            echo "Evidence source revision: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared runtime requirements without building the flat-layout repository
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run M1 NetworkX adapter protocol contract
        if: matrix.backend == 'networkx'
        run: |
          python -m pip install pytest
          python -m pytest -q tests/semantic_graph/test_m1_adapter_protocol_networkx.py
      - name: Install igraph native library
        if: matrix.backend == 'igraph'
        run: python -m pip install 'igraph>=0.11,<2.0'
      - name: Run M7.4 task-level analyzer acceptance for selected backend
        env:
          AE32C_M74_BACKEND: ${{ matrix.backend }}
        run: |
          python -m pip install pytest
          python -m pytest -q tests/semantic_graph/test_m74_task_suitability_acceptance.py
      - name: Run M7.4-G4 snapshot and mutation integrity for selected backend
        env:
          AE32C_M74_BACKEND: ${{ matrix.backend }}
        run: python -m pytest -q tests/semantic_graph/test_m74_snapshot_mutation_integrity.py
      - name: Run M7.4-G4 repository side-effect and snapshot-race qualification
        env:
          AE32C_M74_BACKEND: ${{ matrix.backend }}
        run: python -m pytest -q tests/semantic_graph/test_m74_repository_side_effects.py

      - name: Run synthetic native projection and traversal conformance
        run: |
          python tools/gb03_native_backend_conformance.py \
            --backend "${{ matrix.backend }}" \
            --output "e85-${{ matrix.backend }}.json"
      - name: Run repository-backed graph and source conformance
        run: |
          python tools/gb04_repository_backend_conformance.py \
            --backend "${{ matrix.backend }}" \
            --output "e88-${{ matrix.backend }}-repository.json"
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e85-${{ matrix.backend }}-conformance
          path: |
            e85-${{ matrix.backend }}.json
            e88-${{ matrix.backend }}-repository.json
          if-no-files-found: warn
          retention-days: 30

  graph-tool-native:
    name: Native conformance — graph-tool
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Stage1 source branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids
      - name: Record selected source revision
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Selected source ref: stage1/section-uuids"
          echo "Checked-out source SHA: $SOURCE_SHA"
          {
            echo "Selected source ref: stage1/section-uuids"
            echo "Checked-out source SHA: $SOURCE_SHA"
            echo "Evidence source revision: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Provision graph-tool Python 3.11 environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .github/environments/e85-graph-tool.yml
          environment-name: ae32-e85-graph-tool
          cache-environment: true
          init-shell: bash
      - name: Run graph-tool adapter API and local-adjacency tests
        shell: micromamba-shell {0}
        run: |
          python -m pytest -q tests/semantic_graph/test_e83_multi_backend_traversal.py -k graph_tool
      - name: Run M7.4 task-level analyzer acceptance for graph-tool
        shell: micromamba-shell {0}
        env:
          AE32C_M74_BACKEND: graph-tool
        run: |
          python -m pytest -q tests/semantic_graph/test_m74_task_suitability_acceptance.py
      - name: Run M7.4-G4 snapshot and mutation integrity for graph-tool
        shell: micromamba-shell {0}
        env:
          AE32C_M74_BACKEND: graph-tool
        run: python -m pytest -q tests/semantic_graph/test_m74_snapshot_mutation_integrity.py
      - name: Run M7.4-G4 repository side-effect and snapshot-race qualification for graph-tool
        shell: micromamba-shell {0}
        env:
          AE32C_M74_BACKEND: graph-tool
        run: python -m pytest -q tests/semantic_graph/test_m74_repository_side_effects.py

      - name: Run synthetic native graph-tool conformance
        shell: micromamba-shell {0}
        run: |
          python tools/gb03_native_backend_conformance.py \
            --backend graph-tool \
            --output e85-graph-tool.json
      - name: Run graph-tool repository-backed context and source conformance
        shell: micromamba-shell {0}
        run: |
          python tools/gb04_repository_backend_conformance.py \
            --backend graph-tool \
            --output e88-graph-tool-repository.json
      - name: Upload graph-tool conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e85-graph-tool-conformance
          path: |
            e85-graph-tool.json
            e88-graph-tool-repository.json
          if-no-files-found: warn
          retention-days: 30

  snap-isolated-worker-conformance:
    name: SNAP isolated worker — E.8.5 / E.8.8
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AE32C_SNAP_WORKER_IMAGE: ae32c-snap-worker:ci
    steps:
      - name: Checkout Stage1 source branch
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids
      - name: Record selected source revision
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "AE32C_SOURCE_REVISION=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "Selected source ref: stage1/section-uuids"
          echo "Checked-out source SHA: $SOURCE_SHA"
          {
            echo "Selected source ref: stage1/section-uuids"
            echo "Checked-out source SHA: $SOURCE_SHA"
            echo "Evidence source revision: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python 3.11 orchestrator
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build isolated SNAP 6.0 CPython 3.9 worker image
        run: |
          docker build --pull \
            --file .github/snap-worker/Dockerfile \
            --tag "$AE32C_SNAP_WORKER_IMAGE" .
          IMAGE_ID="$(docker image inspect "$AE32C_SNAP_WORKER_IMAGE" --format '{{.Id}}')"
          echo "AE32C_SNAP_WORKER_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
          echo "SNAP worker image ID: $IMAGE_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify worker adapter protocol and container restrictions
        run: python -m pytest -q tests/semantic_graph/test_snap_worker_adapter.py
      - name: Verify live Docker timeout and container cleanup
        run: python -m pytest -q tests/semantic_graph/test_snap_worker_docker_lifecycle.py
        timeout-minutes: 5
      - name: Verify repository backend resource teardown contract
        run: python -m pytest -q tests/semantic_graph/test_e88_repository_backend_cleanup.py
      - name: Run M7.4 task-level analyzer acceptance for SNAP isolated worker
        env:
          AE32C_M74_BACKEND: snap
        run: |
          python -m pytest -q tests/semantic_graph/test_m74_task_suitability_acceptance.py
      - name: Run M7.4-G4 snapshot and mutation integrity for SNAP worker
        env:
          AE32C_M74_BACKEND: snap
        run: python -m pytest -q tests/semantic_graph/test_m74_snapshot_mutation_integrity.py
      - name: Run M7.4-G4 repository side-effect and lifecycle-race qualification for SNAP worker
        env:
          AE32C_M74_BACKEND: snap
        run: python -m pytest -q tests/semantic_graph/test_m74_repository_side_effects.py

      - name: Run SNAP synthetic native E.8.5 conformance
        run: |
          python tools/gb03_native_backend_conformance.py \
            --backend snap \
            --output e85-snap.json
      - name: Run SNAP repository-backed E.8.8 conformance
        timeout-minutes: 12
        env:
          AE32C_SNAP_WORKER_REQUEST_TIMEOUT_SECONDS: "30"
        run: |
          python tools/gb04_repository_backend_conformance.py \
            --backend snap \
            --output e88-snap-repository.json
      - name: Publish SNAP worker acceptance summary
        if: always()
        run: |
          {
            echo "### SNAP isolated worker conformance"
            echo "- Worker image: $AE32C_SNAP_WORKER_IMAGE"
            echo "- Container policy: network disabled; read-only root; no writable mounts; no capabilities; no repository mount; bounded memory/CPU/PID limits."
            echo "- Python 3.9 and SNAP 6.0 execute only inside the worker image."
            echo "- Python 3.11 orchestrator validates the worker projection, native edge IDs, occurrence mapping, reference parity and repository source hashes."
            echo "- E.8.5 synthetic report: e85-snap.json"
            echo "- E.8.8 repository report: e88-snap-repository.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SNAP E.8.5 / E.8.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e85-e88-snap-isolated-worker
          path: |
            e85-snap.json
            e88-snap-repository.json
          if-no-files-found: warn
          retention-days: 30

  conformance-summary:
    name: E.8.5 / E.8.8 backend conformance summary
    if: always()
    needs: [pip-native-backends, graph-tool-native, snap-isolated-worker-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Publish acceptance summary
        env:
          PIP_BACKENDS: ${{ needs.pip-native-backends.result }}
          GRAPH_TOOL: ${{ needs.graph-tool-native.result }}
          SNAP_JOB: ${{ needs.snap-isolated-worker-conformance.result }}
          SNAP_NATIVE: isolated_worker_e85_e88
          SOURCE_REF: stage1/section-uuids
        run: |
          {
            echo "## Native graph backend conformance"
            echo "- Selected source branch: ${SOURCE_REF}"
            echo "- NetworkX / SciPy / igraph synthetic and repository-backed conformance matrix: ${PIP_BACKENDS}"
            echo "- graph-tool synthetic job execution: ${GRAPH_TOOL}"
            echo "- SNAP isolated-worker E.8.5 / E.8.8 conformance job: ${SNAP_JOB}"
            echo "- SNAP execution mode: ${SNAP_NATIVE}"
            echo "- SNAP acceptance requires successful synthetic and repository-backed reports, exact source hashes, native edge-ID telemetry, and zero parity failures."
            echo "- NetworkX: M1 protocol tests, E.8.5 synthetic conformance and E.8.8 repository/source conformance run in the matrix job."
            echo "- SciPy: E.8.5 synthetic conformance and E.8.8 repository/source conformance run against CSR/CSC native adjacency."
            echo "- igraph: E.8.5 synthetic conformance and E.8.8 repository/source conformance run against native incident-edge IDs."
            echo "- graph-tool: dedicated conda-forge environment runs both synthetic E.8.5 and repository-backed E.8.8 conformance; acceptance requires both reports to pass."
            echo "- A green workflow job status is not, by itself, backend acceptance."
            echo ""
            echo "A backend is accepted only when both synthetic and repository-backed reports show status=passed, with exact source identity, native-adjacency telemetry, zero parity failures and hash-bound source follow-through. graph-tool runs in its dedicated conda-forge environment. SNAP runs in a restricted CPython 3.9 container with a Python 3.11 orchestrator."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${PIP_BACKENDS}" != "success" || "${GRAPH_TOOL}" != "success" || "${SNAP_JOB}" != "success" ]]; then
            exit 1
          fi
