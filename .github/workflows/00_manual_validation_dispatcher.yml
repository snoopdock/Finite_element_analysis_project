name: Manual Validation Dispatcher

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        default: stage1/section-uuids
      profile:
        required: true
        default: latest

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/validation_registry_runner.py --profile "${{ inputs.profile }}"
