name: Manual Validation Dispatcher

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate
        required: true
        default: developing
      profile:
        description: Validation profile ID
        required: true
        default: G3.4.7
      full_regression:
        description: Run full repository regression
        required: true
        default: 'false'

jobs:
  validate:
    name: Validate selected branch from registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Show validation target
        run: |
          echo "Profile: ${{ inputs.profile }}"
          git rev-parse HEAD

      - name: Run targeted validation
        run: |
          pytest tests/semantic_high_assurance -v -s

      - name: Run regression
        if: inputs.full_regression == 'true'
        run: |
          pytest tests/ -v -s
