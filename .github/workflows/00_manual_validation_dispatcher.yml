name: Manual Validation Dispatcher

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate (full branch name)
        type: string
        required: true
        default: stage1/section-uuids
      profile:
        description: Versioned validation profile ID or latest
        type: string
        required: true
        default: latest
      regression_mode:
        description: Regression mode (profile = follow profile declaration)
        required: true
        type: choice
        default: profile
        options:
          - profile
          - skip
          - force

permissions:
  contents: read

jobs:
  validate:
    name: Validate selected branch using main engine
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout requested development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          path: source
          persist-credentials: false

      - name: Checkout central validation engine
        uses: actions/checkout@v4
        with:
          ref: main
          path: validation-engine
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install target and engine dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r source/requirements.txt
          python -m pip install 'jsonschema>=4.20,<5'

      - name: Validate engine with independent unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-artifacts
          python -m unittest discover -s validation-engine/tools/tests -p 'test_*.py' -v \
            2>&1 | tee validation-artifacts/engine-unit-tests.log

      - name: Run declared pytest targets and generate evidence
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.branch }}
          TARGET_PROFILE: ${{ inputs.profile }}
          REGRESSION_MODE: ${{ inputs.regression_mode }}
        run: |
          set -euo pipefail
          python validation-engine/tools/validation_registry_runner.py \
            --repository source \
            --profile "$TARGET_PROFILE" \
            --branch "$TARGET_BRANCH" \
            --regression-mode "$REGRESSION_MODE" \
            --require-provenance \
            --evidence-dir validation-artifacts

      - name: Verify detached evidence digest and artifact checksums
        if: always()
        shell: bash
        run: |
          if [ -f validation-artifacts/validation_report.json ]; then
            python validation-engine/tools/verify_validation_evidence.py \
              --evidence-dir validation-artifacts
          else
            echo 'No evidence report produced; earlier job step failed.'
            exit 1
          fi

      - name: Upload validation evidence (even when tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 30
