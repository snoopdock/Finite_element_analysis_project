name: 05 - Semantic Graph Analysis Validation

on:
  workflow_dispatch:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - "audit_engine/semantic_audit/graph/analysis/**"
      - "audit_engine/semantic_audit/graph/queries/**"
      - "audit_engine/semantic_audit/graph/service.py"
      - "tests/semantic_graph/**"
      - "tools/validate_semantic_graph_analysis.py"
      - "specs/contracts/semantic_graph_analysis_contract.yaml"
      - "docs/schemas/semantic_graph_analysis_schema.json"
      - ".github/workflows/05_semantic_graph_analysis_validation.yml"
  pull_request:
    paths:
      - "audit_engine/semantic_audit/graph/analysis/**"
      - "audit_engine/semantic_audit/graph/queries/**"
      - "audit_engine/semantic_audit/graph/service.py"
      - "tests/semantic_graph/**"
      - "tools/validate_semantic_graph_analysis.py"
      - "specs/contracts/semantic_graph_analysis_contract.yaml"
      - "docs/schemas/semantic_graph_analysis_schema.json"

permissions:
  contents: read

jobs:
  semantic-graph-analysis-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run G3 semantic graph tests
        run: |
          pytest tests/semantic_graph -v

      - name: Validate G3 semantic analysis artifact
        run: |
          python tools/validate_semantic_graph_analysis.py \
            --output artifacts/semantic_graph_analysis_validation.json

      - name: Upload G3 validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: semantic-graph-analysis-validation
          path: artifacts/semantic_graph_analysis_validation.json
          if-no-files-found: error
