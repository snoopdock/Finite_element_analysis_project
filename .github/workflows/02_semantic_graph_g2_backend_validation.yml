name: 02 - Semantic Graph G2 Backend Validation


on:

  workflow_dispatch:


jobs:

  g2-networkx-backend-validation:

    name: G2 NetworkX Adapter Verification

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Install G2 dependencies

        run: |

          python -m pip install --upgrade pip

          pip install networkx


      - name: Run G2 backend validation

        run: |

          python <<'PY'

          import json

          from pathlib import Path


          print("=" * 60)

          print("G2 Semantic Graph NetworkX Backend Validation")

          print("=" * 60)


          from audit_engine.semantic_audit.core.semantic_graph import (
              SemanticGraph,
              SemanticNode,
              SemanticEdge,
          )


          from audit_engine.semantic_audit.graph.backend.networkx_adapter import (
              NetworkXAdapter,
          )


          print("[PASS] Imports")


          graph = SemanticGraph()


          graph.add_node(
              SemanticNode(
                  node_id="module.main",
                  entity_type="SoftwareModule",
                  attributes={}
              )
          )


          graph.add_node(
              SemanticNode(
                  node_id="module.research",
                  entity_type="SoftwareModule",
                  attributes={}
              )
          )


          graph.add_edge(
              SemanticEdge(
                  source_id="module.main",
                  target_id="module.research",
                  relation_type="IMPORTS",
                  attributes={}
              )
          )


          print("[PASS] Semantic graph creation")


          adapter = NetworkXAdapter(graph)


          assert "module.main" in adapter.nodes()

          assert "module.research" in adapter.nodes()


          edges = adapter.edges()


          assert len(edges) == 1

          assert edges[0]["relation"] == "IMPORTS"


          print("[PASS] NetworkX conversion")


          neighbours = adapter.neighbors(
              "module.main"
          )


          assert "module.research" in neighbours


          print("[PASS] Graph traversal")


          core_file = Path(
              "audit_engine/semantic_audit/core/semantic_graph.py"
          )


          core_text = core_file.read_text(
              encoding="utf-8"
          ).lower()


          assert "networkx" not in core_text


          print("[PASS] Core/backend separation")


          result = {

              "workflow":
                  "02 - Semantic Graph G2 Backend Validation",

              "status":
                  "PASSED",

              "checks": {

                  "semantic_graph_import": True,

                  "node_creation": True,

                  "edge_creation": True,

                  "networkx_conversion": True,

                  "relationship_preservation": True,

                  "core_backend_separation": True

              },

              "graph": {

                  "nodes": adapter.nodes(),

                  "edges": edges

              }

          }


          Path(
              "semantic_graph_g2_backend_result.json"
          ).write_text(
              json.dumps(
                  result,
                  indent=4
              ),
              encoding="utf-8"
          )


          print()

          print(json.dumps(result, indent=4))

          print()

          print("G2 validation completed successfully.")


          PY


      - name: Upload G2 validation artifact

        uses: actions/upload-artifact@v4

        with:

          name: semantic_graph_g2_backend_result

          path: semantic_graph_g2_backend_result.json
