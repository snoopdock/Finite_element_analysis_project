name: AE-32C Focused Diagnostics (Manual)

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: "Successful G9.42 run ID for the exact corrected stage1/section-uuids commit"
        type: string
        required: true
      diagnostic_mode:
        description: "Run one NaraRouter smoke test/investigation or one Cloudflare model smoke test/investigation"
        type: choice
        required: true
        default: nararouter_smoke
        options: [nararouter_smoke, nararouter_focused, cloudflare_smoke, cloudflare_focused]
      nararouter_model:
        description: "NaraRouter model for smoke/focused modes; use laguna-s-2.1 (the verified working alias)"
        type: choice
        required: true
        default: laguna-s-2.1
        options:
          - agnes-2.5-flash
          - jev
          - laguna-s-2.1
          - nemotron-3.5-lightning-free
      cloudflare_model:
        description: "Cloudflare model for cloudflare_smoke/cloudflare_focused"
        type: choice
        required: true
        default: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
        options:
          - "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          - "@cf/meta/llama-3.1-8b-instruct-fast"
      baseline_round_robin_run_id:
        description: "Historical round-robin run ID for Cloudflare comparison"
        type: string
        required: true
        default: "40503324230"
      confirm_live_provider_calls:
        description: "Authorize the selected live diagnostic"
        type: boolean
        required: true
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ae32c-focused-diagnostics
  cancel-in-progress: false

jobs:
  guard:
    name: Explicit consent and bounded inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate manual diagnostic request
        shell: bash
        env:
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMED: ${{ inputs.confirm_live_provider_calls }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_round_robin_run_id }}
          MODE: ${{ inputs.diagnostic_mode }}
          NARAROUTER_MODEL: ${{ inputs.nararouter_model }}
          CLOUDFLARE_MODEL: ${{ inputs.cloudflare_model }}
        run: |
          set -euo pipefail
          [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF" == "refs/heads/main" ]] || { echo "::error::Run manually from main."; exit 1; }
          [[ "$CONFIRMED" == "true" ]] || { echo "::error::Explicit live-provider confirmation is required."; exit 1; }
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::validation_run_id must be numeric."; exit 1; }
          [[ "$BASELINE_RUN_ID" =~ ^[0-9]{1,20}$ ]] || { echo "::error::baseline_round_robin_run_id must be numeric."; exit 1; }
          case "$MODE" in nararouter_smoke|nararouter_focused|cloudflare_smoke|cloudflare_focused) ;; *) exit 1;; esac
          if [[ "$MODE" == "cloudflare_smoke" || "$MODE" == "cloudflare_focused" ]]; then
            case "$CLOUDFLARE_MODEL" in
              "@cf/meta/llama-3.3-70b-instruct-fp8-fast"|"@cf/meta/llama-3.1-8b-instruct-fast") ;;
              *) echo "::error::Cloudflare model is not in the reviewed allowlist."; exit 1;;
            esac
          fi
          if [[ "$MODE" == "nararouter_smoke" || "$MODE" == "nararouter_focused" ]]; then
            case "$NARAROUTER_MODEL" in
              agnes-2.5-flash|jev|laguna-s-2.1|nemotron-3.5-lightning-free) ;;
              *) echo "::error::Model alias is not in the reviewed allowlist."; exit 1;;
            esac
          fi
          if [[ "$MODE" == "nararouter_focused" && "$NARAROUTER_MODEL" != "laguna-s-2.1" ]]; then
            echo "::error::The bounded NaraRouter investigation is restricted to the smoke-tested laguna-s-2.1 model."
            exit 1
          fi
          echo "Authorized mode: $MODE. No other provider will be called."

  validation-gate:
    name: Verify exact-commit G9.42 evidence before any live call
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      source_commit_sha: ${{ steps.verify_gate.outputs.source_commit_sha }}
      validation_engine_commit_sha: ${{ steps.verify_gate.outputs.validation_engine_commit_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate development source
        uses: actions/checkout@v4
        with:
          ref: stage1/section-uuids
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evidence-verifier dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6.0,<7.0'
      - name: Retrieve and validate G9.42 run metadata
        id: check_validation_run
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/ae32c-validation-run-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" > "$metadata"
          python audit_engine/semantic_audit/ae32c/validation_gate.py check-run \
            --run-metadata "$metadata" --expected-run-id "$VALIDATION_RUN_ID" \
            --expected-repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
      - name: Download exact validation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VALIDATION_RUN_ATTEMPT: ${{ steps.check_validation_run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ae32c-validation-evidence"
          gh run download "$VALIDATION_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "manual-validation-evidence-${VALIDATION_RUN_ID}-${VALIDATION_RUN_ATTEMPT}" \
            --dir "$RUNNER_TEMP/ae32c-validation-evidence"
      - name: Checkout validation-engine commit from the run
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.check_validation_run.outputs.engine_commit_sha }}
          path: validation-engine
          fetch-depth: 1
          persist-credentials: false
      - name: Independently verify report, artifacts, provenance, and source commit
        id: verify_gate
        working-directory: source
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python audit_engine/semantic_audit/ae32c/validation_gate.py verify \
            --evidence-dir "$RUNNER_TEMP/ae32c-validation-evidence" \
            --run-metadata "$RUNNER_TEMP/ae32c-validation-run-metadata.json" \
            --expected-run-id "$VALIDATION_RUN_ID" --expected-repository "$EXPECTED_REPOSITORY" \
            --source-root . --engine-root ../validation-engine --github-output "$GITHUB_OUTPUT" \
            | tee "$RUNNER_TEMP/ae32c-validation-gate.json"
      - name: Upload validation-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae32c-focused-validation-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ae32c-validation-gate.json
            ${{ runner.temp }}/ae32c-validation-run-metadata.json
          if-no-files-found: warn
          retention-days: 14

  focused-diagnostic:
    name: Run selected focused diagnostic
    needs: [guard, validation-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact G9.42-validated source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validation-gate.outputs.source_commit_sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout workflow-support files from the exact workflow revision
        if: inputs.diagnostic_mode == 'cloudflare_focused'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-support
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31.0,<3.0.0' 'PyYAML>=6.0,<7.0'
      - name: Verify diagnostic files at the validated commit
        working-directory: source
        env:
          MODE: ${{ inputs.diagnostic_mode }}
          VALIDATED_SHA: ${{ needs.validation-gate.outputs.source_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]
          [[ -f audit_engine/semantic_audit/ae32c/live_evaluation.py ]]
          if [[ "$MODE" == "nararouter_smoke" ]]; then
            [[ -f tools/ae32c_provider_compatibility_smoke.py ]] || { echo "::error::Operational patch is missing from validated source."; exit 1; }
            # The script's imports must resolve from the repository root. This preflight
            # only asks argparse for help; it does not initialize a provider or make HTTP calls.
            PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python tools/ae32c_provider_compatibility_smoke.py --help >/dev/null
          fi
          if [[ "$MODE" == "nararouter_focused" ]]; then
            [[ -f providers/factory.py ]]
            [[ -f tests/semantic_audit/fixtures/ae32c_provider_interface_incident/pipeline/extractor.py ]]
            [[ -f tests/semantic_audit/fixtures/ae32c_provider_interface_incident/providers/adapter.py ]]
          fi
          if [[ "$MODE" == "cloudflare_smoke" ]]; then
            [[ -f tools/ae32c_provider_compatibility_smoke.py ]] || { echo "::error::Provider smoke script is missing from validated source."; exit 1; }
            PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" python tools/ae32c_provider_compatibility_smoke.py --help >/dev/null
          fi
          if [[ "$MODE" == "cloudflare_focused" ]]; then
            [[ -f providers/cloudflare.py ]]
            [[ -f tests/semantic_audit/fixtures/ae32c_provider_interface_incident/pipeline/extractor.py ]]
            [[ -f tests/semantic_audit/fixtures/ae32c_provider_interface_incident/providers/adapter.py ]]
            [[ -f "$GITHUB_WORKSPACE/workflow-support/tools/compare_ae32c_cloudflare_focus.py" ]] || { echo "::error::Comparison helper missing from workflow-support checkout."; exit 1; }
          fi
      - name: Download historical batch before Cloudflare call
        if: inputs.diagnostic_mode == 'cloudflare_focused'
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN_ID: ${{ inputs.baseline_round_robin_run_id }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/ae32c-baseline-run-metadata.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}" > "$metadata"
          attempt="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_attempt"])' "$metadata")"
          mkdir -p "$RUNNER_TEMP/ae32c-baseline"
          gh run download "$BASELINE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ae32c-round-robin-${BASELINE_RUN_ID}-${attempt}" --dir "$RUNNER_TEMP/ae32c-baseline"
          echo "Historical artifact downloaded before any new Cloudflare call."
      - name: Run exactly one NaraRouter compatibility request
        if: inputs.diagnostic_mode == 'nararouter_smoke'
        working-directory: source
        env:
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          NARAROUTER_DIAGNOSTIC_MODEL: ${{ inputs.nararouter_model }}
          FEA_LLM_REQUEST_TIMEOUT_SECONDS: "90"
          FEA_LLM_RETRY_ATTEMPTS: "1"
        run: |
          set -u
          out="$RUNNER_TEMP/ae32c-focused-diagnostic"; mkdir -p "$out"
          result="$out/nararouter-smoke.json"
          if [[ -z "${NARAROUTER_API_KEY:-}" ]]; then
            printf '%s\n' '{"schema_version":"ae32c/provider-compatibility-smoke/v1","provider":"nararouter","status":"configuration_failed","reason_code":"NARAROUTER_API_KEY_missing","live_provider_calls_made":false}' > "$result"
          else
            set +e
            PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" timeout --signal=TERM --kill-after=5s 180s python tools/ae32c_provider_compatibility_smoke.py \
              --confirm-live-provider-calls --provider nararouter --model "$NARAROUTER_DIAGNOSTIC_MODEL" \
              > "$result" 2> "$out/nararouter-smoke-stderr.txt"
            rc=$?; set -e
            printf '%s\n' "$rc" > "$out/nararouter-smoke-runner-exit-code.txt"
            if [[ ! -s "$result" ]]; then
              printf '{"schema_version":"ae32c/provider-compatibility-smoke/v1","provider":"nararouter","status":"runner_timeout_or_no_output","runner_exit_code":%s,"live_provider_calls_may_have_started":true}\n' "$rc" > "$result"
            fi
          fi
          python - "$result" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8")); diag=d.get("diagnostics",{}).get("last_http_error_diagnostic",{})
          print("### NaraRouter one-request diagnostic")
          print(f"- Status: `{d.get('status','unknown')}`")
          print("- Endpoint: `https://router.bynara.id/v1/chat/completions` (fixed)")
          print(f"- Model: `{d.get('model','not reported')}`")
          print(f"- HTTP status: `{diag.get('http_status','not reported')}`")
          print(f"- Error type/code/parameter: `{diag.get('error_type','not reported')}` / `{diag.get('error_code','not reported')}` / `{diag.get('error_param','not reported')}`")
          print(f"- Body shape/status: `{diag.get('body_shape','not reported')}` / `{diag.get('body_status','not reported')}`")
          print(f"- Marker matched: `{d.get('response_marker_match','not applicable')}`")
          print("- Raw response and free-form provider error are not printed.")
          PY
      - name: Run one bounded NaraRouter baseline-versus-graph investigation
        if: inputs.diagnostic_mode == 'nararouter_focused'
        working-directory: source
        env:
          NARAROUTER_API_KEY: ${{ secrets.NARAROUTER_API_KEY }}
          NARAROUTER_DIAGNOSTIC_MODEL: ${{ inputs.nararouter_model }}
          FEA_LLM_REQUEST_TIMEOUT_SECONDS: "90"
          FEA_LLM_RETRY_ATTEMPTS: "1"
        run: |
          set -u
          out="$RUNNER_TEMP/ae32c-focused-diagnostic"
          current="$out/nararouter-current"
          mkdir -p "$current"
          if [[ -z "${NARAROUTER_API_KEY:-}" ]]; then
            printf '%s\n' '{"status":"configuration_failed","reason_code":"NARAROUTER_API_KEY_missing","live_provider_calls_made":false}' > "$out/nararouter-run-status.json"
            echo "NaraRouter secret missing; no provider request was made."
          else
            set +e
            timeout --signal=TERM --kill-after=15s 1100s \
              python -m audit_engine.semantic_audit.ae32c.live_evaluation \
                --confirm-live-provider-calls --provider nararouter \
                --model "$NARAROUTER_DIAGNOSTIC_MODEL" \
                --repo-root tests/semantic_audit/fixtures/ae32c_provider_interface_incident \
                --output-dir "$current" \
                > "$out/nararouter-live-evaluation.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$out/nararouter-runner-exit-code.txt"
            printf '{"status":"runner_finished","runner_exit_code":%s,"live_provider_calls_may_have_started":true}\n' "$rc" > "$out/nararouter-run-status.json"
          fi
      - name: Run one Cloudflare model compatibility smoke request
        if: inputs.diagnostic_mode == 'cloudflare_smoke'
        working-directory: source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DIAGNOSTIC_MODEL: ${{ inputs.cloudflare_model }}
          FEA_LLM_REQUEST_TIMEOUT_SECONDS: "45"
          FEA_LLM_RETRY_ATTEMPTS: "1"
        run: |
          set -u
          out="$RUNNER_TEMP/ae32c-focused-diagnostic"; mkdir -p "$out"
          result="$out/cloudflare-smoke.json"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            printf '%s\n' '{"schema_version":"ae32c/provider-compatibility-smoke/v1","provider":"cloudflare","status":"configuration_failed","reason_code":"Cloudflare credentials missing","live_provider_calls_made":false}' > "$result"
          else
            set +e
            PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}" timeout --signal=TERM --kill-after=5s 180s \
              python tools/ae32c_provider_compatibility_smoke.py \
                --confirm-live-provider-calls --provider cloudflare --model "$CLOUDFLARE_DIAGNOSTIC_MODEL" \
                > "$result" 2> "$out/cloudflare-smoke-stderr.txt"
            rc=$?; set -e
            printf '%s\n' "$rc" > "$out/cloudflare-smoke-runner-exit-code.txt"
            if [[ ! -s "$result" ]]; then
              printf '{"schema_version":"ae32c/provider-compatibility-smoke/v1","provider":"cloudflare","status":"runner_timeout_or_no_output","runner_exit_code":%s,"live_provider_calls_may_have_started":true}\n' "$rc" > "$result"
            fi
          fi
      - name: Run one focused Cloudflare investigation
        if: inputs.diagnostic_mode == 'cloudflare_focused'
        working-directory: source
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DIAGNOSTIC_MODEL: ${{ inputs.cloudflare_model }}
          FEA_LLM_REQUEST_TIMEOUT_SECONDS: "45"
          FEA_LLM_RETRY_ATTEMPTS: "2"
        run: |
          set -u
          out="$RUNNER_TEMP/ae32c-focused-diagnostic"; current="$out/cloudflare-current"; mkdir -p "$current"
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            printf '%s\n' '{"status":"configuration_failed","reason_code":"Cloudflare credentials missing","live_provider_calls_made":false}' > "$out/cloudflare-run-status.json"
          else
            set +e
            timeout --signal=TERM --kill-after=15s 1100s python -m audit_engine.semantic_audit.ae32c.live_evaluation \
              --confirm-live-provider-calls --provider cloudflare --model "$CLOUDFLARE_DIAGNOSTIC_MODEL" \
              --repo-root tests/semantic_audit/fixtures/ae32c_provider_interface_incident \
              --output-dir "$current" > "$out/cloudflare-live-evaluation.log" 2>&1
            rc=$?; set -e
            printf '%s\n' "$rc" > "$out/cloudflare-runner-exit-code.txt"
            printf '{"status":"runner_finished","runner_exit_code":%s,"live_provider_calls_may_have_started":true}\n' "$rc" > "$out/cloudflare-run-status.json"
          fi
      - name: Compare Cloudflare result with historical trials
        if: inputs.diagnostic_mode == 'cloudflare_focused'
        env:
          BASELINE_ROOT: ${{ runner.temp }}/ae32c-baseline
          CURRENT_ROOT: ${{ runner.temp }}/ae32c-focused-diagnostic/cloudflare-current
          OUTPUT_ROOT: ${{ runner.temp }}/ae32c-focused-diagnostic
        run: |
          set -euo pipefail
          python workflow-support/tools/compare_ae32c_cloudflare_focus.py --baseline-root "$BASELINE_ROOT" \
            --current-root "$CURRENT_ROOT" --output-json "$OUTPUT_ROOT/cloudflare-comparison.json" \
            --output-markdown "$OUTPUT_ROOT/cloudflare-comparison.md"
          cat "$OUTPUT_ROOT/cloudflare-comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize Cloudflare smoke outcome
        if: inputs.diagnostic_mode == 'cloudflare_smoke' && always()
        env:
          RESULT: ${{ runner.temp }}/ae32c-focused-diagnostic/cloudflare-smoke.json
        run: |
          python - "$RESULT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          print("### Cloudflare one-request model compatibility smoke")
          if not p.is_file():
              print("- Result JSON: **missing**; inspect uploaded artifacts.")
              raise SystemExit(0)
          d=json.loads(p.read_text(encoding="utf-8"))
          diag=d.get("diagnostics",{}) if isinstance(d.get("diagnostics"),dict) else {}
          http=diag.get("last_http_error_diagnostic",{}) if isinstance(diag.get("last_http_error_diagnostic"),dict) else {}
          print(f"- Model: `{d.get('model','not reported')}`")
          print(f"- Status: `{d.get('status','unknown')}`")
          print(f"- HTTP status: `{diag.get('last_http_status',http.get('http_status','not reported'))}`")
          print(f"- Marker matched: `{d.get('response_marker_match','not reported')}`")
          print(f"- Error code/type/parameter: `{http.get('error_code','not reported')}` / `{http.get('error_type','not reported')}` / `{http.get('error_param','not reported')}`")
          print("- One-request diagnostic only; no investigation was run.")
          PY
      - name: Summarize NaraRouter focused investigation
        if: inputs.diagnostic_mode == 'nararouter_focused' && always()
        env:
          CURRENT_ROOT: ${{ runner.temp }}/ae32c-focused-diagnostic/nararouter-current
          STATUS_FILE: ${{ runner.temp }}/ae32c-focused-diagnostic/nararouter-run-status.json
        run: |
          python - "$CURRENT_ROOT" "$STATUS_FILE" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          status_path=Path(sys.argv[2])
          print("### NaraRouter bounded baseline-versus-graph investigation")
          if status_path.is_file():
              status=json.loads(status_path.read_text(encoding="utf-8"))
              print(f"- Runner status: `{status.get('status','unknown')}`")
              print(f"- Runner exit code: `{status.get('runner_exit_code','not reported')}`")
          candidates=sorted(root.rglob("comparison.json"), key=lambda p: p.stat().st_mtime)
          if not candidates:
              print("- Comparison artifact: **missing**; inspect uploaded logs.")
              raise SystemExit(0)
          d=json.loads(candidates[-1].read_text(encoding="utf-8"))
          baseline=d.get("baseline",{}) if isinstance(d.get("baseline"),dict) else {}
          graph=d.get("graph_assisted",{}) if isinstance(d.get("graph_assisted"),dict) else {}
          summary=graph.get("summary",{}) if isinstance(graph.get("summary"),dict) else {}
          report=graph.get("report",{}) if isinstance(graph.get("report"),dict) else {}
          coverage=report.get("required_source_coverage",{}) if isinstance(report.get("required_source_coverage"),dict) else {}
          textual=report.get("source_textual_support",{}) if isinstance(report.get("source_textual_support"),dict) else {}
          print(f"- Provider/model: `{d.get('provider','unknown')}` / `{d.get('model','unknown')}`")
          print(f"- Baseline status: `{baseline.get('status','unknown')}`")
          print(f"- Graph status / stop reason: `{summary.get('status','unknown')}` / `{summary.get('stop_reason','unknown')}`")
          print(f"- Model rounds / tool calls: `{summary.get('model_rounds','unknown')}` / `{summary.get('tool_call_count','unknown')}`")
          print(f"- Required source coverage: `{coverage.get('status',summary.get('required_source_coverage_status','unknown'))}`")
          print(f"- Textual source support: `{textual.get('status',summary.get('source_textual_support_status','unknown'))}`")
          print(f"- Citation validation: `{summary.get('final_citation_validation','unknown')}`")
          print(f"- Missing complete reads: `{coverage.get('missing_complete_reads',summary.get('required_source_missing_reads',[]))}`")
          print(f"- Missing direct root-cause citations: `{coverage.get('missing_root_cause_direct_citations',summary.get('required_source_missing_root_citations',[]))}`")
          print(f"- Automated diagnosis accuracy: `{d.get('evaluation_policy',{}).get('diagnostic_accuracy','not assessed')}`")
          print(f"- Comparison Markdown: `{candidates[-1].with_suffix('.md')}`")
          PY
      - name: Summarize NaraRouter outcome
        if: inputs.diagnostic_mode == 'nararouter_smoke' && always()
        env:
          RESULT: ${{ runner.temp }}/ae32c-focused-diagnostic/nararouter-smoke.json
        run: |
          if [[ -f "$RESULT" ]]; then
            python - "$RESULT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(f"\nCompletion received: `{d.get('response_received',False)}`")
          print(f"One-request limit: `{d.get('request_count_limit','not reported')}`")
          print(f"HTTP attempts reported: `{d.get('http_attempts_reported','not reported')}`")
          PY
          fi
      - name: Upload diagnostic artifacts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae32c-focused-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ae32c-focused-diagnostic/
            ${{ runner.temp }}/ae32c-validation-gate.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce diagnostic outcome after preserving artifacts
        if: always()
        env:
          MODE: ${{ inputs.diagnostic_mode }}
          RESULT_ROOT: ${{ runner.temp }}/ae32c-focused-diagnostic
        run: |
          set -euo pipefail
          if [[ "$MODE" == "nararouter_smoke" ]]; then
            python - "$RESULT_ROOT/nararouter-smoke.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.is_file(): raise SystemExit("NaraRouter output missing; inspect uploaded artifacts.")
          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("status") != "completion_received": raise SystemExit("NaraRouter did not return a parseable completion; diagnostics were preserved.")
          if d.get("response_marker_match") is not True: raise SystemExit("NaraRouter did not match the expected marker; diagnostics were preserved.")
          print("NaraRouter returned a parseable completion and matched the marker.")
          PY
          elif [[ "$MODE" == "cloudflare_smoke" ]]; then
            python - "$RESULT_ROOT/cloudflare-smoke.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          if not p.is_file(): raise SystemExit("Cloudflare smoke output missing; inspect uploaded artifacts.")
          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("status") != "completion_received": raise SystemExit("Cloudflare did not return a parseable completion; diagnostics were preserved.")
          if d.get("response_marker_match") is not True: raise SystemExit("Cloudflare did not match the expected marker; do not run the full investigation yet.")
          print("Cloudflare returned a parseable completion and matched the marker. Full investigation may be run separately.")
          PY
          elif [[ "$MODE" == "nararouter_focused" ]]; then
            python - "$RESULT_ROOT/nararouter-current" <<'PY'
          import json,sys
          from pathlib import Path
          candidates=list(Path(sys.argv[1]).rglob("comparison.json"))
          if not candidates: raise SystemExit("NaraRouter comparison artifact missing; inspect uploaded logs.")
          d=json.loads(sorted(candidates,key=lambda p:p.stat().st_mtime)[-1].read_text(encoding="utf-8"))
          graph=d.get("graph_assisted",{}).get("summary",{})
          print("NaraRouter investigation artifacts were published.")
          print(f"Graph status: {graph.get('status','unknown')}; stop reason: {graph.get('stop_reason','unknown')}.")
          print("This workflow validates artifact publication, not diagnosis correctness or investigation success.")
          PY
          else
            python - "$RESULT_ROOT/cloudflare-current" <<'PY'
          import json,sys
          from pathlib import Path
          candidates=list(Path(sys.argv[1]).rglob("comparison.json"))
          if not candidates: raise SystemExit("Cloudflare comparison missing; inspect uploaded artifacts.")
          d=json.loads(candidates[0].read_text(encoding="utf-8"))
          graph=d.get("graph_assisted",{}) if isinstance(d.get("graph_assisted"),dict) else {}
          report=graph.get("report",{}) if isinstance(graph.get("report"),dict) else {}
          coverage=report.get("required_source_coverage",{}) if isinstance(report.get("required_source_coverage"),dict) else {}
          status=report.get("status","unknown")
          stop_reason=report.get("stop_reason","unknown")
          coverage_status=coverage.get("status","unknown")
          if coverage_status != "complete":
              raise SystemExit(f"Cloudflare required source coverage is {coverage_status!r} (stop_reason={stop_reason!r}); artifacts were preserved.")
          if status != "completed":
              raise SystemExit(f"Cloudflare source coverage is complete, but graph status is {status!r} (stop_reason={stop_reason!r}); artifacts were preserved.")
          print("Cloudflare run completed with required source coverage. Accuracy remains unassessed.")
          PY
          fi
