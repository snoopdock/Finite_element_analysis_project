name: AE-32C M7.5 Epistemic Contracts, Provenance and Assurance Arguments

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_epistemic_contracts.yml"
      - "docs/audit-engine/AE-32C-M7.5.8-Epistemic-Coverage-and-Unknown-State-Assurance.md"
      - "docs/audit-engine/AE-32C-M7.5.8-Validation-Record-45903022544.md"
      - "docs/audit-engine/AE-32C-M7.5.8-Validation-Record-45903188231.md"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m75_epistemic_contracts.py"
      - "tests/semantic_graph/test_m75_epistemic_store.py"
      - "tests/semantic_graph/test_m75_epistemic_completeness.py"
      - "tests/semantic_graph/test_m75_epistemic_provenance.py"
      - "tests/semantic_graph/test_m755_assurance_arguments.py"
      - "tests/semantic_graph/test_m756_freshness_closure.py"
      - "tests/semantic_graph/test_m757_persisted_assurance.py"
      - "tests/semantic_graph/test_m758_epistemic_coverage.py"
      - "tests/semantic_graph/test_m759_rule_derived_coverage.py"
      - "audit_engine/semantic_audit/ae32c/rule_contracts.py"
      - "audit_engine/semantic_audit/ae32c/__init__.py"
      - "docs/audit-engine/AE-32C-M7.5.9-Trusted-Rule-Derived-Coverage-Registry.md"
      - "docs/audit-engine/AE-32C-M7.5.7-Provenance-Backed-Assurance-Evaluation.md"
      - "docs/audit-engine/AE-32C-M7.5.6-Recursive-Provenance-Freshness-Closure.md"
      - "audit_engine/semantic_audit/epistemic/assurance.py"
      - "audit_engine/semantic_audit/epistemic/assurance_store.py"
      - "docs/audit-engine/AE-32C-M7.5.5-Assurance-Arguments-and-Defeaters.md"
      - "docs/audit-engine/AE-32C-M7.5.1-Epistemic-Contracts.md"
      - "docs/audit-engine/AE-32C-M7.5.2-Append-Only-Epistemic-Persistence.md"
      - "docs/audit-engine/AE-32C-M7.5.3-Scope-Bound-Completeness-and-Negative-Claims.md"
      - "docs/audit-engine/AE-32C-M7.5.4-Provenance-Dependencies-Freshness-and-Invalidation.md"
      - "docs/audit-engine/AE-32C-M7.5.4-Validation-Record-45898608483.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32c-m75-epistemic-stage1
  cancel-in-progress: false

jobs:
  epistemic-validation:
    name: M7.5.1–M7.5.9 structural and behavioral validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile the epistemic package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m compileall -q audit_engine/semantic_audit/epistemic 2>&1 | tee reports/m75-compile.log

      - name: Run M7.5.1 contract tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75_epistemic_contracts.py' \
            -v 2>&1 | tee reports/m75-1-epistemic-contracts.log

      - name: Run M7.5.2 persistence tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75_epistemic_store.py' \
            -v 2>&1 | tee reports/m75-2-epistemic-store.log

      - name: Run M7.5.3 completeness and negative-claim tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75_epistemic_completeness.py' \
            -v 2>&1 | tee reports/m75-3-completeness.log

      - name: Run M7.5.4 provenance and invalidation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75_epistemic_provenance.py' \
            -v 2>&1 | tee reports/m75-4-provenance.log

      - name: Run M7.5.5 assurance argument and defeater tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m755_assurance_arguments.py' \
            -v 2>&1 | tee reports/m75-5-assurance-arguments.log

      - name: Run M7.5.6 recursive freshness closure tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m756_freshness_closure.py' \
            -v 2>&1 | tee reports/m75-6-freshness-closure.log

      - name: Run M7.5.7 persisted assurance tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m757_persisted_assurance.py' \
            -v 2>&1 | tee reports/m75-7-persisted-assurance.log

      - name: Run M7.5.8 epistemic coverage and unknown-state tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m758_epistemic_coverage.py' \
            -v 2>&1 | tee reports/m75-8-epistemic-coverage.log

      - name: Run M7.5.9 trusted rule-derived coverage tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m759_rule_derived_coverage.py' \
            -v 2>&1 | tee reports/m75-9-rule-derived-coverage.log

      - name: Upload exact-source validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-5-epistemic-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/m75-compile.log
            reports/m75-1-epistemic-contracts.log
            reports/m75-2-epistemic-store.log
            reports/m75-3-completeness.log
            reports/m75-4-provenance.log
            reports/m75-5-assurance-arguments.log
            reports/m75-6-freshness-closure.log
            reports/m75-7-persisted-assurance.log
            reports/m75-8-epistemic-coverage.log
            reports/m75-9-rule-derived-coverage.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize validation boundary
        if: always()
        run: |
          {
            echo "## M7.5 epistemic validation"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Scope: immutable contracts, append-only persistence, scope-bound completeness, negative-claim admissibility, provenance dependencies, local freshness, recursive freshness closure, deterministic invalidation, assurance arguments, defeater lifecycle and provenance-backed persisted assurance evaluation, and claim-relative epistemic coverage/unknown-state assessment, and versioned AE-32C rule-derived obligation generation"
            echo "- No proposition-truth inference, automatic completeness promotion, registry authentication, network, solver, or decision-gate integration"
            echo "- Passing does not establish production durability or production approval"
          } >> "$GITHUB_STEP_SUMMARY"
