name: AE-32C M7.5.1 Epistemic Contract Validation

on:
  push:
    branches:
      - stage1/section-uuids
    paths:
      - ".github/workflows/m7_5_epistemic_contracts.yml"
      - "audit_engine/semantic_audit/epistemic/**"
      - "tests/semantic_graph/test_m75_epistemic_contracts.py"
      - "docs/audit-engine/AE-32C-M7.5.1-Epistemic-Contracts.md"
      - "docs/audit-engine/AE-32C-M7.4-Closure-and-Transition.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ae32c-m75-epistemic-contracts-stage1
  cancel-in-progress: false

jobs:
  contract-tests:
    name: M7.5.1 immutable contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile the epistemic contract package
        run: python -m compileall -q audit_engine/semantic_audit/epistemic

      - name: Run M7.5.1 structural and behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover \
            -s tests/semantic_graph \
            -p 'test_m75_epistemic_contracts.py' \
            -v 2>&1 | tee reports/m75-1-epistemic-contracts.log

      - name: Upload exact-source validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-5-1-epistemic-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/m75-1-epistemic-contracts.log
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize validation boundary
        if: always()
        run: |
          {
            echo "## M7.5.1 epistemic contract validation"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Scope: immutable value-object validation only"
            echo "- No persistence, inference, network, solver, or decision-gate integration"
            echo "- Passing does not establish epistemic completeness or production approval"
          } >> "$GITHUB_STEP_SUMMARY"
