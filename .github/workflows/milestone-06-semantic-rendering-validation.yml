name: Milestone 06 Semantic Rendering Validation

on:
  workflow_dispatch:

jobs:
  milestone06-interface-discovery:
    name: Milestone 06 Repository Interface Discovery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout developing branch
        uses: actions/checkout@v4
        with:
          ref: developing

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Milestone 06 interface discovery
        run: |
          pytest tests/test_milestone06_repository_interfaces.py -v
