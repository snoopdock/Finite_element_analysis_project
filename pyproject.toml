[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fea_pipeline"
version = "1.0.0"
description = "Automated cybernetic pipeline for FEM guideline synthesis."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
