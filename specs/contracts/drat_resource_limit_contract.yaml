contract_id: semantic-audit/drat-resource-limits/v1
status: normative
owner: semantic-audit/high-assurance
purpose: Define bounded proof checking without converting resource exhaustion into semantic judgment.
limits:
  - max_steps
  - max_total_literals
  - max_clause_width
  - max_formula_clauses
  - max_rat_resolvents_per_step
semantics:
  resource_limit_reached: proof_not_accepted
  semantic_counterclaim_created: false
  evidence_promotion_allowed: false
  external_unsat_may_remain_observed: true
  independent_alternative_checker_may_still_establish_verdict: true
