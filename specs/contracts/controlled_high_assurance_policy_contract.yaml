  - executable_witness
  - theorem_prover
invariants:
  - policy_denial_is_not_semantic_refutation
  - mechanism_permission_alone_does_not_activate_sensitive_adapter
  - profile_catalog_presence_is_not_activation
  - formal_router_stays_inactive_until_real_adapter_contracts_exist
