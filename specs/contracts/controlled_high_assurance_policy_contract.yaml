    - static_analysis
    - artifact_integrity
  allowed_containment_modes:
    - in_process_read_only
  allow_network: false
  allow_side_effects: false
  require_witness_for_validated: true
  require_exhaustive_envelope_for_validated: true
  activated_adapter_ids: []
explicit_activation_required:
