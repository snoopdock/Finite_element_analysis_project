
version: 1
milestone: G3.1.0
purpose: >-
  Define evidence-bound verification obligations, decisions, attempts, and
  immutable receipts without allowing graph analysis to make audit judgments.

boundaries:
  graph_analysis: produces observations and observed evidence
  verification: tests explicit obligations against bounded source artifacts
  rules: interpret verification receipts under policy
  findings: may only be created from triggered rule evaluations

verification_obligation:
  required_fields:
    - obligation_id
    - obligation_type
    - source_analysis_id
    - observation_ids
    - evidence_ids
    - graph_fingerprint
    - semantic_context_fingerprint
    - state
  invariants:
    - referenced_observations_belong_to_source_analysis
    - referenced_evidence_belongs_to_source_analysis
    - graph_fingerprint_matches_source_analysis
    - semantic_context_fingerprint_matches_source_analysis
    - obligation_is_not_a_finding

verification_decisions:
  - confirmed
  - refuted
  - inconclusive
  - error

evidence_states:
  - proposed
  - observed
  - corroborated
  - validated
  - rejected
  - inconclusive
  - stale

receipt:
  schema_version: semantic_verification_receipt/v1
  immutable: true
  required_bindings:
    - obligation_id
    - source_analysis_id
    - verifier_id
    - verifier_version
    - graph_fingerprint
    - semantic_context_fingerprint
    - evidence_ids

forbidden_actions:
  - silently_promote_observed_evidence_to_validated
  - convert_graph_reachability_directly_to_audit_finding
  - treat_corroboration_as_truth
  - treat_inconclusive_verification_as_confirmation
  - verify_against_different_graph_or_semantic_context
