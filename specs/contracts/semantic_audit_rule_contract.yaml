
version: 1
milestone: G3.1.0
purpose: Define declarative policy rules evaluated only over verification receipts.

required_fields:
  - rule_id
  - version
  - obligation_type
  - title
  - finding_message

optional_fields:
  - severity
  - trigger_decision
  - minimum_evidence_state
  - metadata

invariants:
  - rules_do_not_execute_graph_queries
  - rules_do_not_upgrade_evidence
  - rules_are_versioned
  - rule_evaluation_is_separate_from_finding_creation
  - unknown_rule_fields_are_rejected
