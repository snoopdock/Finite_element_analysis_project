version: 1
name: retrieval_attention_pipeline_contract
objective: >-
  Define the narrow composition boundary that connects persisted retrieval
  history through R7A context construction and R7B attention evaluation into
  R7C proposal persistence without adding retrieval, lifecycle execution, or
  scientific-state behavior.

dependencies:
  retrieval_attention_context:
    name: retrieval_attention_context_contract
    version: 1
  retrieval_attention_policy:
    name: retrieval_attention_policy_contract
    version: 1
  retrieval_attention_provenance:
    name: retrieval_attention_provenance_contract
    version: 1
  retrieval_attention_proposal:
    name: retrieval_attention_proposal_contract
    version: 1
  retrieval_attention_persistence:
    name: retrieval_attention_persistence_contract
    version: 1

composition:
  sequence:
    - read_persisted_retrieval_history
    - build_r7a_context
    - evaluate_r7b_attention
    - persist_r7b_proposals
  rules:
    - The adapter composes existing layers and must not duplicate their semantics.
    - Retrieval execution is outside the adapter.
    - Lifecycle transitions are outside the adapter.
    - Recommended action execution is outside the adapter.
    - Scientific-state mutation is outside the adapter.

inputs:
  required:
    - state
    - explicit_policy
  state_rule: >-
    Retrieval history is read from the existing persisted retrieval-history
    state using the established state adapter.
  policy_rule: >-
    The R7B policy must be supplied explicitly; the adapter must not hide
    repetition thresholds or policy-version values in implementation logic.

outputs:
  required:
    - context
    - evaluation
    - persisted_count
    - duplicate_count
  context_meaning: R7A factual retrieval-attention context used for this evaluation.
  evaluation_meaning: Deterministic R7B attention interpretation for the supplied context and policy.
  persisted_count_meaning: Number of newly stored attention proposals.
  duplicate_count_meaning: Number of proposals whose attention_id was already persisted and therefore were not overwritten.

persistence_behavior:
  rules:
    - Each generated R7B attention item is passed unchanged in semantic content to the established R7C persistence adapter.
    - Duplicate attention_id values are idempotent and must not overwrite existing proposals.
    - An evaluation with zero attention items performs no proposal append.
    - Existing retrieval history is not modified by proposal persistence.
    - Existing scientific state is not modified by the adapter.

idempotency:
  rule: >-
    Re-running the adapter against unchanged retrieval history and unchanged
    policy may regenerate the same R7B proposal IDs, but R7C persistence must
    prevent duplicate stored proposals.
  distinction: >-
    Idempotent proposal persistence does not imply that a new retrieval event
    should be suppressed; retrieval execution remains outside this adapter.

lifecycle_boundary:
  generation_status: open
  rules:
    - The adapter only persists proposals generated by R7B in lifecycle_status open.
    - The adapter must not transition proposals to addressed or closed.
    - Later lifecycle management must operate on persisted proposal state without rewriting retrieval history.

execution_boundary:
  prohibited:
    - retrieval_execution
    - provider_retry
    - query_reformulation_execution
    - alternate_provider_execution
    - automatic_action_execution
    - proposal_to_scientific_state
    - retrieval_history_rewrite

scientific_isolation:
  must_not_modify:
    - retrieval_history
    - retrieval_report
    - propositions
    - evidence_relations
    - epistemic_state
    - evidence_strength
    - truth_status
    - ranking
    - convergence
    - writing_content
  rules:
    - Retrieval history is an input provenance source, not an output target.
    - Attention proposals remain process metadata.
    - No evidence or scientific relation is created merely by generating or persisting an attention proposal.

error_boundary:
  rules:
    - Input validation errors remain explicit and must not be silently converted into scientific conclusions.
    - A failure in proposal persistence must not rewrite or delete retrieval history.
    - The adapter must not execute fallback retrieval or action behavior after a persistence error.

scope:
  included:
    - retrieval-history read
    - R7A context construction
    - R7B evaluation
    - R7C proposal persistence composition
    - duplicate accounting
  excluded:
    - retrieval execution
    - action execution
    - lifecycle transitions
    - evidence assessment
    - epistemic inference
    - ranking changes
    - convergence changes
    - writer decisions
