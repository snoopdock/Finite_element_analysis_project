version: 6
purpose: >-
  Define the deterministic projection from the semantic publication Document
  into renderer-neutral LaTeX IR without reconstructing or changing scientific
  or document identity authority.

authority:
  source_document: semantic_document_model
  scientific_equations: domain_semantic_model
  citations: evidence_model
  internal_targets: semantic_document_model
  generated_labels: label_registry
  target_ir: latex_ir
  rule: >-
    Projection may copy rendering payloads from authoritative registries, but
    may not infer semantic identity from LaTeX strings, titles, labels, or
    legacy derived metadata.

mapping:
  section:
    output: SectionModel
    preserve:
      - section_id
      - title
      - order
    generated:
      - label
    label_source: label_registry(section_id)
  paragraph:
    output: ParagraphBlock
    preserve_inline_order: true
  text:
    output: IRTextSpan
    escape_at_renderer: true
  inline_math:
    output: IRMathSpan
    authoritative_equation: false
  citation_occurrence:
    output: IRCitationSpan
    preserve:
      - occurrence_id
      - source_id
    source_resolution: evidence_model
  citation_cluster_occurrence:
    output: IRCitationSpan
    preserve:
      - occurrence_id
      - source_ids
      - source_order
    source_resolution: evidence_model
    rendering: one_multi_key_citation_command
  cross_reference_occurrence:
    output: IRCrossReferenceSpan
    preserve:
      - occurrence_id
      - target_id
    resolve_through:
      - label_registry
      - reference_resolver
    generated:
      - target_type
      - label
  display_math:
    output: MathBlock
    authoritative_equation: false
  equation_occurrence:
    output: EquationBlock
    preserve:
      - occurrence_id
      - equation_id
      - caption
    expression_resolution: domain_semantic_model
    generated_label_source: label_registry(occurrence_id)
    manual_semantic_label: reject
  figure:
    output: FigureBlock
    preserve:
      - figure_id
      - asset
      - caption
      - source_ids
      - order
    generated_label_source: label_registry(figure_id)
    manual_semantic_label: reject
    asset_policy: safe_repository_relative_graphics_path
    provenance_resolution: evidence_model
  table:
    output: TableBlock
    preserve:
      - table_id
      - columns
      - rows
      - caption
      - source_ids
      - order
    generated_label_source: label_registry(table_id)
    manual_semantic_label: reject
    cell_rendering: escaped_plain_text
    provenance_resolution: evidence_model

  concept_graph_view:
    output: ConceptGraphBlock
    preserve:
      - occurrence_id
      - concept_id
      - relationship_id
      - names
      - relation_types
      - selection_counts
      - selection_policy
    authority: knowledge_graph_ids_only
    rule: >-
      Projection renders the already-selected semantic publication view and
      must not inspect runtime knowledge_graph state or apply additional
      truncation.
  relationship_table_view:
    output: RelationshipTableBlock
    preserve:
      - occurrence_id
      - relationship_id
      - source_proposition_id
      - target_proposition_id
      - statements
      - relation_type
      - selection_counts
      - selection_policy
    authority: knowledge_graph_ids_only
    rule: >-
      Statements are display snapshots; proposition and relationship UUIDs
      remain authoritative upstream.

unsupported_until_dedicated_projection_contract:
  equation_proposal_reference: reject

rendering:
  plain_text: escaped
  inline_math: typed_math_only
  display_math: typed_math_only
  citations: stable_source_id_to_deterministic_reference_key
  internal_references: generated_label_only
  figure_placement: fixed_order_non_floating_H
  table_placement: fixed_order_non_floating_H
  concept_graph: explicit_ir_view_only
  relationship_table: explicit_ir_view_only
  package_loading: derived_from_ir_capabilities
  figure_assets: validated_path_only
  figure_table_text_payloads: escaped_plain_text
  unicode_math: >-
    normalize typed math at the math-node boundary and render supported Unicode
    mathematical glyphs in plain text contextually; global Unicode hooks are forbidden
  legacy_math_scanning: forbidden
  global_math_command_redefinition: forbidden
  global_unicode_math_hooks: forbidden
  global_underscore_behavior_override: forbidden
  global_sloppy_layout: forbidden

failure_policy:
  unresolved_equation_id: reject
  unresolved_source_id: reject
  unresolved_cross_reference_target: reject
  duplicate_document_target_id: reject
  label_target_mismatch: reject
  unresolved_equation_proposal: reject
  unsafe_figure_asset: reject
  malformed_table_shape: reject
  manual_figure_or_table_label: reject
  unsupported_semantic_object: reject
  silent_fallback_to_legacy_section_adapter: forbidden
  silent_semantic_flattening: forbidden
  title_or_text_based_reference_resolution: forbidden

invariants:
  - document_order_is_preserved
  - paragraph_inline_order_is_preserved
  - citation_occurrence_identity_is_preserved
  - citation_cluster_occurrence_identity_is_preserved
  - citation_cluster_source_order_is_preserved
  - citation_keys_do_not_depend_on_evidence_order
  - citation_keys_are_projection_metadata_not_source_identity
  - cross_reference_occurrence_identity_is_preserved
  - cross_reference_target_identity_is_preserved
  - equation_occurrence_identity_is_preserved
  - equation_expression_is_resolved_by_equation_id
  - figure_identity_and_order_are_preserved
  - table_identity_shape_and_order_are_preserved
  - figure_and_table_provenance_ids_resolve_through_evidence
  - latex_labels_are_generated_from_document_object_identity
  - legacy_key_equations_do_not_drive_projection
  - legacy_citations_used_do_not_drive_projection
  - prose_is_never_scanned_for_latex_during_projection
  - renderer_does_not_mutate_semantic_identity
  - citation_keys_are_stable_projections_of_source_identity
  - publication_text_contains_no_unprojected_math_unicode
