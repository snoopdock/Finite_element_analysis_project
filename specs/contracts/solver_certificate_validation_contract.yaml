contract_id: solver_certificate_validation_contract
version: 1
status: normative
principle: producing_solver_cannot_self_validate
sat_model:
  validation:
    - assignment_binds_every_declared_variable_exactly_once
    - assignment_values_are_boolean
    - assignment_satisfies_every_cnf_clause
  validated_completeness: certificate_complete_within_scope
bounded_unsat:
  validation:
    - repository_owned_checker_independently_enumerates_assignment_space
    - every_assignment_is_checked_or_a_counterexample_is_found
  validated_completeness: exhaustive_within_scope
large_unsat_without_supported_proof_checker:
  maximum_state: observed
  completeness: partial
false_unsat:
  behavior:
    - independently_found_model_overrules_external_unsat_claim
    - counterexample_is_preserved_as_validated_evidence
forbidden_interpretations:
  - unsupported_unsat_proof_is_treated_as_validated
  - external_exit_code_is_a_certificate
  - solver_certificate_extends_beyond_declared_validation_envelope
