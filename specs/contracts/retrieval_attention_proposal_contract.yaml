version: 1
name: retrieval_attention_proposal_contract
objective: >-
  Freeze the boundary between deterministic R7B retrieval-attention
  interpretation and later lifecycle, persistence, and acquisition-action
  handling without introducing a second scientific or decision-making state.

dependency:
  attention_policy_contract:
    name: retrieval_attention_policy_contract
    version: 1
  attention_provenance_contract:
    name: retrieval_attention_provenance_contract
    version: 1
  composition_rule: >-
    R7B attention output is the canonical attention-proposal representation.
    R7B.5 constrains and freezes that representation; it does not introduce a
    duplicate interpretation object or alter retrieval, scientific, or
    policy-evaluation semantics.

canonical_representation:
  meaning: >-
    One R7B attention item is one deterministic attention proposal generated
    from one normalized query-provider context under one explicit policy.
  required_fields:
    - attention_id
    - policy_version
    - query_scope
    - provider
    - attention_reason
    - observed_condition
    - lifecycle_status
    - supporting_event_ids
    - recommended_acquisition_action
  rules:
    - R7B attention output is the canonical proposal; no parallel proposal object is required merely for persistence.
    - lifecycle_status must be open when the proposal is first generated by R7B.
    - supporting_event_ids must contain the historical retrieval events used by the interpretation.
    - observed_condition must be one allowed trigger class from the R7B policy contract.
    - recommended_acquisition_action must be one allowed acquisition-process action from the R7B policy contract.

identity:
  attention_id:
    meaning: >-
      Deterministic identity for the R7B interpretation of the supplied policy,
      query-provider scope, observed condition, and supporting event IDs.
    rules:
      - The identifier must not depend on mutable scientific state.
      - The identifier must not depend on wall-clock time for deterministic R7B evaluation.
      - Re-evaluating the same context with the same policy must reproduce the same attention_id.
  policy_version:
    meaning: Exact explicit acquisition-policy version used for this interpretation.
    rule: Existing proposal provenance must not be silently reinterpreted under a newer policy version.

observation_basis:
  required_trace:
    - query_scope
    - provider
    - observed_condition
    - supporting_event_ids
  rules:
    - The proposal must be explainable from R7A context, supporting retrieval-history events, and the recorded policy values/version.
    - Supporting event IDs are the primary provenance link; counts alone are insufficient.
    - Query and provider scope identify the operational target and must not be promoted into scientific scope.
    - An attention proposal references acquisition facts; it does not create evidence relations merely by referencing retrieval events.

lifecycle_boundary:
  statuses:
    open:
      meaning: R7B has generated a proposal that currently warrants process attention.
    addressed:
      meaning: A bounded acquisition-process response has been executed or explicitly recorded for the proposal.
    closed:
      meaning: The governing process policy determines that no further action is currently required for the proposal.
  generation_rule: R7B creates proposals only with lifecycle_status open.
  transition_owner: Future lifecycle-management logic, not the R7B evaluator.
  rules:
    - Lifecycle is derived proposal metadata and is separate from immutable retrieval history.
    - A lifecycle transition must not rewrite, delete, or replace supporting retrieval-history events.
    - Addressed does not assert that the underlying provider or query condition was scientifically resolved.
    - Closed does not assert permanent provider recovery or scientific resolution.
    - A later retrieval event may support a lifecycle transition, but it becomes a new historical fact rather than a mutation of prior events.
    - Older proposals remain historically traceable even when newer interpretations supersede their current process relevance.

recommendation_boundary:
  field: recommended_acquisition_action
  allowed_actions:
    - retry_provider
    - retry_query
    - reformulate_query
    - expand_query_scope
    - use_alternate_provider
    - defer_until_provider_recovery
  rules:
    - A recommendation describes bounded retrieval-process behavior only.
    - The recommendation is advisory metadata, not an execution command.
    - R7B must not execute the recommended action as part of attention evaluation.
    - Executing an action belongs to a later subsystem and must produce new retrieval-history events.
    - Recommendation selection must remain explainable from the observed operational condition and explicit policy.

persistence_boundary:
  deterministic_core:
    fields:
      - attention_id
      - policy_version
      - query_scope
      - provider
      - attention_reason
      - observed_condition
      - lifecycle_status
      - supporting_event_ids
      - recommended_acquisition_action
    rules:
      - These fields form the deterministic R7B proposal representation.
      - Adding wall-clock timestamps to this core would violate R7B deterministic replay semantics.
  persistence_envelope:
    future_fields:
      - generated_at
    rules:
      - Persistence may add lifecycle/provenance envelope metadata required by storage contracts, including generated_at.
      - Persistence metadata must not change the meaning or deterministic identity of the R7B proposal core.
      - Replaying the R7B proposal core must not require the persistence envelope timestamp.

scientific_isolation:
  must_not_modify:
    - retrieval_history
    - retrieval_report
    - propositions
    - evidence_relations
    - epistemic_state
    - evidence_strength
    - truth_status
    - ranking
    - convergence
    - writing_content
  forbidden_interpretations:
    - scientific_absence
    - evidence_quality
    - truth_assessment
    - epistemic_confidence
    - scientific_relevance
    - scientific_importance
    - ranking_adjustment
    - convergence_adjustment
    - writer_instruction
  rules:
    - Attention proposal is process metadata, not evidence.
    - Lifecycle status is not scientific confidence, truth, uncertainty, or evidence quality.
    - Recommended action is not scientific judgment.
    - Supporting retrieval events are acquisition facts, not scientific support relations merely because a proposal references them.

execution_boundary:
  prohibited_direct_transitions:
    - proposal_to_scientific_state
    - proposal_to_historical_event_mutation
    - proposal_to_automatic_action_execution
  required_closed_loop: >-
    Any later execution path must follow the sequence attention proposal ->
    bounded acquisition action -> new retrieval-history event, preserving prior
    history unchanged.

reproducibility:
  rules:
    - The same R7A context plus the same explicit policy values/version must reproduce the same deterministic proposal core.
    - Proposal identity and trigger interpretation must not depend on wall-clock time, network retrieval, an LLM call, or mutable scientific state.
    - Persistence timestamps may differ without changing the R7B proposal identity or interpretation.

scope:
  included:
    - canonical R7B proposal representation
    - proposal identity
    - supporting-event traceability
    - lifecycle boundary
    - recommendation boundary
    - deterministic versus persistence-envelope separation
    - scientific isolation
  excluded:
    - proposal persistence implementation
    - lifecycle transition implementation
    - action selection beyond the R7B bounded recommendation
    - action execution
    - evidence assessment
    - epistemic inference
    - ranking changes
    - convergence changes
    - writer decisions
