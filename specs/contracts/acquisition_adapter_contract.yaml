version: 1
name: acquisition_adapter_contract
status: accepted
objective: >-
  Define the semantic boundary for translating an explicitly created
  AcquisitionRequest into downstream acquisition execution while producing
  acquisition-level execution provenance through an AcquisitionExecutionReceipt.
  The AcquisitionRequest is the authoritative semantic model. Translation into
  the existing retrieval representation is deliberately lossy when necessary,
  but semantic loss must be explicit, bounded, and observable.

architectural_role:
  input_object:
    name: AcquisitionRequest
    authority: acquisition_process_request
    semantic_claim: >-
      An explicit process object specifying acquisition work and operational
      constraints that may be attempted downstream.
  adapter:
    name: AcquisitionAdapter
    authority: acquisition_execution_boundary
    semantic_claim: >-
      A translation and execution-boundary component that converts an
      AcquisitionRequest into the representation required by the existing
      retrieval interface and records the resulting execution occurrence.
  output_object:
    name: AcquisitionExecutionReceipt
    authority: acquisition_execution_history
    semantic_claim: >-
      A durable or durably representable record of one acquisition execution
      occurrence, including its relationship to the AcquisitionRequest, its
      operational outcome, and material translation loss.
  retrieval_execution:
    interface: List[str]
    current_status: existing_interface
    rule: >-
      The existing retrieval execution interface remains responsible for
      retrieval/provider behavior. The adapter owns translation into that
      interface but does not redefine it.
  evidence:
    name: EvidenceRecord
    authority: scientific_evidence_provenance
    rule: >-
      EvidenceRecord remains a source-level knowledge/provenance object and is
      outside the adapter's semantic output boundary.

core_invariants:
  - AcquisitionRequest is the authoritative semantic model at this boundary.
  - AcquisitionAdapter consumes AcquisitionRequest, not upstream planning or scientific objects.
  - AcquisitionAdapter produces AcquisitionExecutionReceipt for each execution occurrence.
  - AcquisitionRequest remains distinct from AcquisitionExecutionReceipt.
  - AcquisitionExecutionReceipt remains distinct from EvidenceRecord.
  - AcquisitionAdapter is a translation and execution boundary, not a planner.
  - AcquisitionAdapter does not evaluate scientific meaning of retrieval results.
  - AcquisitionAdapter does not create or mutate lifecycle state.
  - AcquisitionAdapter does not modify historical planning, request, attention, or execution records.
  - Existing retrieve_evidence_parallel(List[str]) semantics remain unchanged by this contract.
  - Request execution is explicit; adapter execution is not an automatic side effect of planning evaluation.
  - Semantic fidelity has priority over representation completeness.
  - Loss of representation is acceptable only when the loss is explicit and observable.

input_boundary:
  accepted_object:
    name: AcquisitionRequest
    required: true
    source: explicit_request_formulation_boundary
  prohibited_inputs:
    - AttentionProposal
    - ResearchPlanningSignal
    - ResearchPlanningDecision
    - RetrievalEvent
    - EvidenceRecord
    - ScientificAttention
    - LifecycleEvent
  rule: >-
    Upstream objects remain traceable through the AcquisitionRequest origin and
    must not be supplied to the adapter as an alternative execution input.

semantic_authority:
  authoritative_model: AcquisitionRequest
  legacy_representation: List[str]
  rule: >-
    The legacy execution representation is not an authoritative semantic model.
    It exists only because the current retrieval runtime accepts query strings.
    New architecture must not be constrained to fields that happen to fit the
    legacy representation.
  fidelity_order:
    - preserve semantic meaning
    - preserve provenance
    - preserve operational constraints when representable
    - preserve structural detail only when available

translation:
  responsibility: >-
    Translate the semantic target and supported operational constraints of an
    AcquisitionRequest into the existing retrieval execution representation.
  current_retrieval_shape:
    input: List[str]
  mode: lossy_by_design
  intermediate_model:
    conceptual_name: AcquisitionExecutionProjection
    persistence: not_required_by_this_contract
    semantic_role: >-
      A precise internal translation result used to determine which source
      semantics are preserved, translated, degraded, or unrepresentable before
      producing the legacy execution representation. It is not a new authority.
  translation_classes:
    preserved:
      meaning: >-
        Source meaning remains available without reinterpretation at the
        execution boundary.
    translated:
      meaning: >-
        Equivalent source meaning is expressed using a different representation
        required by the legacy execution interface.
    degraded:
      meaning: >-
        Only a bounded subset of the source representation can be carried. The
        exact loss must be identified and must not change the retained meaning.
    unrepresentable:
      meaning: >-
        The target interface cannot express the source semantic element. It must
        not be silently discarded or falsely reported as enforced.
  stages:
    - validate AcquisitionRequest against its own contract
    - construct a precise semantic projection
    - classify material fields as preserved, translated, degraded, or unrepresentable
    - produce legacy execution representation from the representable projection
    - preserve material translation loss as execution provenance
    - invoke the existing retrieval interface
  structural_loss_boundary: >-
    Conversion from the structured AcquisitionRequest into List[str] is an
    explicit adapter responsibility. The retrieval function must not be required
    to reconstruct the AcquisitionRequest from query strings.
  allowed_translation:
    - normalize AcquisitionRequest.target.query_scope into executable query strings
    - apply supported provider preferences or access constraints where the existing execution boundary can represent them
    - apply supported execution limits where the existing execution boundary can represent them exactly
    - preserve process execution priority as adapter/process metadata without converting it into scientific priority
  translation_truthfulness: >-
    The adapter must distinguish requested semantics from semantics actually
    representable or enforceable by the downstream interface. Similar-looking
    legacy parameters must not be treated as semantic equivalents without an
    explicit equivalence rule.
  unsupported_constraints:
    rule: >-
      Operational constraints that cannot be represented or enforced by the
      current retrieval interface must be classified as unrepresentable and
      reported explicitly. They must not be silently ignored, silently
      reinterpreted, or converted into scientific semantics.
  loss_reporting:
    required: true
    rule: >-
      Every material degraded or unrepresentable request element encountered
      during execution must be observable through acquisition execution
      provenance. Translation loss describes adapter limitations, not scientific
      weakness or evidence quality.
  prohibited_translation:
    - encode provider preferences into query text merely to imitate provider selection
    - encode provider access restrictions into query text merely to imitate enforcement
    - map unrelated numeric parameters solely because both represent quantities or limits
    - convert process priority into scientific priority
    - convert provider failure into evidence weakness
    - convert empty results into literature absence
    - convert operational constraints into epistemic claims
    - attach planning objects to EvidenceRecord solely to preserve execution provenance

field_translation:
  target_query_scope:
    source: AcquisitionRequest.target.query_scope
    target: List[str]
    class: translated
    rule: >-
      query_scope is the primary executable projection in this contract. The
      adapter may produce one or more concrete query strings from the request
      scope, but may not add scientific claims or provider directives that are
      absent from the source semantics.
  provider_preferences:
    source: AcquisitionRequest.constraints.provider_preferences
    current_target_support: unavailable
    class_when_unrepresentable: unrepresentable
    rule: >-
      Provider preferences must not be encoded into query text. When the current
      retrieval interface cannot represent the preference, the limitation is
      recorded and execution proceeds without claiming provider selection was
      enforced.
  provider_access_constraints:
    source: AcquisitionRequest.constraints.provider_access_constraints
    current_target_support: unavailable
    class_when_unrepresentable: unrepresentable
    rule: >-
      Provider-access restrictions must not be converted into query semantics.
      When the current interface cannot enforce a restriction, the adapter
      records the limitation and must not report the restriction as honored.
  execution_limits:
    source: AcquisitionRequest.constraints.execution_limits
    current_target_support: partial_or_unknown
    rule: >-
      An execution limit may be translated only when the current retrieval
      boundary exposes an exact semantic equivalent. A similar-looking legacy
      parameter is not an equivalent merely because its value is numeric.
      Otherwise the limit is recorded as unrepresentable.
  process_priority:
    source: AcquisitionRequest.priority
    current_target_support: adapter_metadata
    class: preserved
    rule: >-
      Process execution priority remains process metadata at the adapter
      boundary. It must not affect scientific ranking, evidence weighting, claim
      priority, or scientific relevance.

execution_policy:
  lossy_execution_allowed: true
  rule: >-
    This contract favors useful execution through a known lossy projection over
    forcing the legacy interface to pretend it supports semantics it cannot
    represent.
  unsupported_constraint_behavior:
    rule: >-
      An unrepresentable operational constraint does not automatically invalidate
      the entire AcquisitionRequest. The adapter may continue with the supported
      projection when execution remains semantically safe, while recording the
      exact translation loss and never claiming the unsupported constraint was
      applied.
    exception_rule: >-
      A future AcquisitionRequest vocabulary may explicitly mark a constraint as
      execution-mandatory. That future contract may require pre-execution
      rejection; this contract does not invent that vocabulary implicitly.
  empty_projection:
    rule: >-
      If translation yields no valid executable query input, retrieval execution
      must not be invoked merely to manufacture an outcome. The adapter must
      return an explicit translation/execution failure provenance result.

execution_provenance:
  output_object: AcquisitionExecutionReceipt
  identity:
    required_fields:
      - execution_id
      - acquisition_request_id
      - started_at
      - completed_at
      - execution_status
  relationship:
    acquisition_request_id: >-
      Identifies the AcquisitionRequest whose explicit execution produced this
      execution occurrence.
    execution_id: >-
      Identifies one execution occurrence and is distinct from acquisition_request_id.
  occurrence_rule: >-
    Each execution attempt is a separate occurrence. A retry creates a new
    AcquisitionExecutionReceipt and must not overwrite the receipt of an earlier
    attempt.
  translation_provenance:
    required: true
    rule: >-
      The receipt records material translation loss and the distinction between
      requested semantics and semantics actually represented at execution.

receipt_fields:
  required:
    - execution_id
    - acquisition_request_id
    - started_at
    - completed_at
    - execution_status
  optional:
    - translation_policy_version
    - translation_results
    - translation_losses
    - execution_constraints_applied
    - generated_query_inputs
    - provider_execution_summary
    - error_summary
  translation_results:
    semantic_role: >-
      Per-field classification of preserved, translated, degraded, or
      unrepresentable source semantics.
  translation_losses:
    semantic_role: >-
      Material degraded or unrepresentable elements retained for execution
      provenance and auditability.
  execution_status:
    allowed_values:
      - success
      - failure
      - partial_failure
      - empty_result
      - rate_limited
    semantic_role: operational_execution_outcome_only
  execution_constraints_applied:
    semantic_role: >-
      Operational constraints actually applied or enforced during this execution.
      This field must not contain scientific interpretation.
  generated_query_inputs:
    semantic_role: >-
      Query strings or equivalent execution inputs generated by the adapter from
      the AcquisitionRequest. They document adapter translation rather than
      scientific conclusions.
  provider_execution_summary:
    semantic_role: >-
      Operational provider outcomes relevant to the execution occurrence. It is
      not an evidence-quality or truth assessment.
  error_summary:
    semantic_role: >-
      Operational description of execution failure or limitation without
      epistemic interpretation.

relationship_to_evidence:
  rule: >-
    AcquisitionExecutionReceipt records why and how an acquisition execution
    occurred. EvidenceRecord records source-level provenance and knowledge-bearing
    evidence information. The two objects must remain semantically separate.
  allowed_relationship: >-
    Evidence produced by an execution may retain its existing source-level
    provenance, including source_id, retrieved_at, query_context(s), and
    provider(s), without requiring an acquisition_request_id field on the
    EvidenceRecord.
  many_to_many_protection: >-
    A source may be discovered by multiple acquisition requests or execution
    occurrences. The adapter must therefore not assume that one EvidenceRecord
    belongs to exactly one AcquisitionRequest.
  prohibited_changes:
    - add acquisition_request_id to EvidenceRecord solely for adapter provenance
    - redefine EvidenceRecord as an execution receipt
    - reinterpret source-level provider/query provenance as request causality
    - require EvidenceRecord to represent failed executions with no source result
    - store translation loss in EvidenceRecord as scientific or source provenance

relationship_to_retrieval_runtime:
  current_function: retrieve_evidence_parallel
  current_input: List[str]
  contract_rule: >-
    The adapter may invoke the existing retrieval execution boundary after an
    explicit AcquisitionRequest is available. This contract does not alter the
    function signature, provider implementation, retrieval normalization, or
    evidence merging behavior.
  responsibility_split:
    acquisition_adapter:
      - validate accepted AcquisitionRequest semantics
      - build a precise semantic projection
      - classify translation loss
      - translate query_scope and supported operational constraints
      - invoke downstream retrieval execution through the existing interface
      - capture execution timing and operational outcome
      - produce AcquisitionExecutionReceipt
    retrieval_runtime:
      - perform retrieval/provider execution
      - return retrieval results through its existing interface
      - maintain existing source-level evidence provenance
  prohibited_runtime_changes:
    - changes to retrieve_evidence_parallel
    - provider-layer redesign
    - EvidenceRecord schema redesign
    - introduction of RetrievalEvent as an adapter requirement

execution_status_semantics:
  operational_only: true
  mappings:
    success:
      meaning: retrieval execution completed without an operational failure classified by the executor
    failure:
      meaning: execution failed operationally
    partial_failure:
      meaning: execution completed with a bounded mixture of successful and failed operational components
    empty_result:
      meaning: execution completed but produced no returned records through the current retrieval interface
    rate_limited:
      meaning: execution was prevented or limited by provider rate limiting
  semantic_non_equivalences:
    - failure != evidence_weakness
    - failure != claim_uncertainty
    - empty_result != literature_absence
    - empty_result != evidence_gap
    - rate_limited != evidence_weakness
    - partial_failure != scientific_disagreement
    - translation_loss != evidence_weakness
    - translation_loss != evidence_gap
    - translation_loss != claim_uncertainty

authority_isolation:
  planning:
    prohibited:
      - create ResearchPlanningDecision
      - revise ResearchPlanningDecision
      - create ResearchPlanningSignal
      - revise ResearchPlanningSignal
      - alter planning priority semantics
  attention:
    prohibited:
      - create AttentionProposal
      - revise AttentionProposal
      - reinterpret retrieval conditions as attention state
  scientific:
    prohibited:
      - create ScientificAttention
      - modify epistemic state
      - modify confidence
      - modify evidence strength
      - modify claim ranking
      - modify convergence
      - generate scientific conclusions
  lifecycle:
    prohibited:
      - create LifecycleEvent
      - advance AttentionProposal lifecycle state
      - close or reopen lifecycle state
      - rewrite lifecycle history
  request_history:
    prohibited:
      - rewrite AcquisitionRequest
      - mutate the originating ResearchPlanningDecision

failure_and_retry:
  retry_rule: >-
    A retry of an AcquisitionRequest is a new execution occurrence with a new
    execution_id and a new AcquisitionExecutionReceipt.
  history_rule: >-
    Earlier execution receipts remain historical records even when a later retry
    succeeds.
  request_identity_rule: >-
    Multiple execution receipts may reference the same acquisition_request_id.
  no_merge_rule: >-
    Retries must not be represented by mutating one receipt to contain multiple
    execution occurrences.
  translation_history_rule: >-
    A later retrieval interface with richer semantic support may reduce future
    translation loss, but it must not rewrite what was unrepresentable during an
    earlier execution occurrence.

automatic_execution:
  planning_boundary: >-
    Evaluation of a ResearchPlanningDecision does not automatically instantiate,
    dispatch, or execute an AcquisitionRequest.
  request_boundary: >-
    Creation of an AcquisitionRequest is an explicit process step under the
    AcquisitionRequest contract.
  adapter_boundary: >-
    The adapter executes only when an explicit AcquisitionRequest is submitted to
    the execution boundary. The adapter is not a background authority that creates
    requests or decides what should be acquired.

lifecycle_isolation:
  rules:
    - AcquisitionExecutionReceipt does not create a LifecycleEvent.
    - Execution success does not imply addressed or closed lifecycle state.
    - Execution failure does not imply open, addressed, or closed lifecycle state.
    - Execution retry does not reopen or alter lifecycle state.
    - Translation loss does not imply lifecycle state.
    - AcquisitionAdapter has no lifecycle transition authority.

persistence:
  status: future_boundary
  requirements:
    - AcquisitionExecutionReceipt should be persistable independently of EvidenceRecord.
    - execution_id must uniquely identify one execution occurrence within its persistence scope.
    - acquisition_request_id must preserve the causal relationship to the executed request.
    - Historical receipts must remain independently addressable for audit and retry reconstruction.
    - Material translation loss should remain available for later audit of execution fidelity.
  excluded:
    - concrete storage key
    - database implementation
    - replay implementation
    - event-sourcing architecture
    - automatic persistence integration

validation:
  input:
    AcquisitionRequest_required: true
    scientific_objects_rejected: true
    lifecycle_objects_rejected: true
  translation:
    authoritative_model_is_AcquisitionRequest: true
    legacy_representation_is_List[str]: true
    lossy_translation_allowed: true
    translation_classification_required: true
    material_translation_loss_reported: true
    unsupported_constraints_reported: true
    silent_constraint_loss_rejected: true
    silent_reinterpretation_rejected: true
    query_translation_explicit: true
    false_enforcement_claims_rejected: true
  receipt:
    execution_id_required: true
    acquisition_request_id_required: true
    execution_status_required: true
    retry_creates_new_execution_id: true
    translation_provenance_required: true
    operational_semantics_only: true
  separation:
    evidence_remains_source_level: true
    retrieval_report_remains_cycle_summary: true
    retrieval_event_not_required: true
    planning_authority_excluded: true
    scientific_authority_excluded: true
    lifecycle_authority_excluded: true

non_decisions:
  - No provider-layer redesign is introduced by this contract.
  - No EvidenceRecord schema changes are introduced by this contract.
  - No RetrievalEvent model is required by this contract.
  - No main.py integration is required by this contract.
  - No pending_evidence_queries integration is required by this contract.
  - No scientific interpretation is introduced by this contract.
  - No lifecycle transition is introduced by this contract.
  - No requirement is introduced for the legacy retrieval interface to reconstruct AcquisitionRequest semantics.

relationship_to_r8_6_2:
  rule: >-
    This contract consumes the AcquisitionRequest defined by R8.6.2 and preserves
    its planning-to-acquisition boundary. It defines the downstream translation
    and execution-provenance boundary without changing the AcquisitionRequest
    contract.
  preserved_decisions:
    - AcquisitionRequest is a distinct process object.
    - Origin is through ResearchPlanningDecision rather than duplicated upstream provenance.
    - query_scope is the minimal target vocabulary.
    - Operational constraints govern acquisition attempts, not scientific interpretation.
    - Priority is process execution priority only.
    - Request creation is an explicit boundary and is not automatic planner behavior.
    - Retrieval execution remains downstream of the request.

relationship_to_r8_7_1_2:
  rule: >-
    This contract implements the R8.7.1.2 decision selecting
    AcquisitionExecutionReceipt as the execution-level provenance model.
  preserved_decisions:
    - EvidenceRecord remains source-level only.
    - retrieval_report remains a cycle summary.
    - Execution occurrences are distinct from requests.
    - Retries create new execution receipts.
    - Retrieval runtime remains unaware of upstream planning semantics.

relationship_to_r8_7_3:
  rule: >-
    This contract freezes the R8.7.3 decision that AcquisitionRequest is the
    authoritative semantic model and translation into List[str] is a deliberate
    lossy projection rather than a semantic collapse.
  preserved_decisions:
    - Semantic fidelity has priority over representation completeness.
    - query_scope is concretely projected into legacy query inputs.
    - Material translation loss is explicitly classified and observable.
    - Unsupported constraints are not falsely reported as enforced.
    - The adapter remains replaceable when the retrieval interface becomes richer.

scope:
  included:
    - adapter semantic role
    - authoritative semantic model
    - bounded lossy translation
    - translation classification and loss reporting
    - input boundary
    - existing retrieval interface boundary
    - execution receipt relationship
    - execution status semantics
    - retry semantics
    - source-level evidence separation
    - planning, scientific, and lifecycle isolation
    - unsupported constraint handling
    - future persistence requirements
    - validation requirements
  excluded:
    - adapter implementation
    - retrieval implementation changes
    - provider redesign
    - EvidenceRecord redesign
    - RetrievalEvent design
    - lifecycle runtime
    - scientific inference
