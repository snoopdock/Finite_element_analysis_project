topic: "Finite Element Method Theory Implementation and Modeling Rules"
objective: |
  Produce a comprehensive technical guideline explaining how the Finite Element Method works
  including mathematical foundation, step-by-step procedure, and rules for modeling physical phenomena.

seed_queries:
  - "finite element method mathematical foundation weak form Galerkin method"
  - "finite element method practical implementation modeling rules"
  - "finite element method verification validation numerical stability"

cloudflare_models:
  - "@cf/meta/llama-3.1-8b-instruct"
  - "@cf/qwen/qwen2.5-7b-instruct"
  - "@cf/mistral/mistral-7b-instruct-v0.2"

budget:
  max_llm_calls_per_run: 20
  max_tokens_per_call: 2500

cache:
  max_size_mb: 500

phase_delay_seconds: 5

state:
  path: state/current_state.json

daily_limits:
  max_evidence_items: 4
  max_research_cycles: 1

writing:
  w_L: 0.4
  w_U: 0.4
  w_A: 0.2
  theta: 0.75
  tau: 0.60
  top_k_knowledge_items: 6
  max_paragraphs_per_section: 3
  max_retries_per_paragraph: 2
  max_decision_history: 100
  model_selection:
    high_eta_model_index: 0
    low_eta_model_index: -1

section_leverage:
  "Introduction and Scope of the Finite Element Method": 1.0
  "Mathematical Foundation: Strong Form, Weak Form, and Galerkin Method": 1.25
  "The Finite Element Procedure": 1.15
  "Rules for Modeling Physical Phenomena with FEM": 1.10
  "Verification, Validation, and Best Practices": 1.05

oaa:
  enabled: true
  repetition_threshold: 2
  too_simple_threshold: 2
  merge_threshold: 2
  action_confidence_threshold: 0.65
  weight: 0.35
  cost_weight: 0.15
  severity_weights:
    repetition: 1.00
    too_simple: 0.95
    merge_candidate: 0.85
    length_imbalance: 0.65
    missing_transition: 0.55
  cost_weights:
    merge_candidate: 0.85
    too_simple: 0.75
    repetition: 0.45
    length_imbalance: 0.40
    missing_transition: 0.35

semantic_verification:
  # Disabled by default because each verified claim consumes an LLM call.
  enabled: false
  max_claims_per_cycle: 4
  max_sources_per_claim: 2
  max_passages_per_source: 2
  max_passage_chars: 1800
  max_tokens_per_claim: 700
  model: null

  # Stage 4: scientific-context extraction. Disabled by default until runtime
  # evaluation confirms that its extra calls are worthwhile.
  context_enrichment_enabled: false
  max_context_items_per_cycle: 3
  max_context_sources_per_item: 2
  max_context_passage_chars: 1800
  context_model: null
  max_context_tokens: 500

  # Perspective/corrective loop. Also disabled by default.
  correction_enabled: false
  max_evidence_queries_per_cycle: 2
  max_pending_evidence_queries: 8
  max_perspective_jobs_per_cycle: 2
  perspective_model: null
  max_rewrites_per_cycle: 0
  rewrite_model: null
  max_rewrite_tokens: 900

convergence:
  window: 3
  eta_variance_threshold: 0.1
  minimum_reading_coverage_percent: 80.0
  minimum_citation_coverage_percent: 80.0
  minimum_lexical_support_coverage_percent: 0.0
  evidence_path: output/evidence.json

gap_detection:
  max_wikipedia_topics: 30
  max_gap_queries_per_cycle: 3
  min_concepts_per_topic: 2
  wikipedia_pages:
    - Finite element method
    - Weak formulation
    - Galerkin method
    - Structural mechanics

splitting:
  min_word_count: 300
  min_concept_coverage: 3
  max_subsections: 3

merging:
  max_sections: 8
  merge_similarity_threshold: 0.5

models:
  fallback_enabled: true
  max_retries_per_call: 2
